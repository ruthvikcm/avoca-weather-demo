stors; Apollo Funds announced a strategic minority investment in May 2026)","type":"pe_rollup_brand","company":"Air Comfort Solutions OKC","note":"Serves the Oklahoma City and Tulsa metros across all three trades; Air Comfort Solutions is documented as acquired by Apex, making it a direct Apex platform target in the metro."},{"trades":"HVAC, plumbing","parent":"Turnpoint Services (OMERS Private Equity; acquired from Trivest in 2025)","type":"pe_rollup_brand","company":"Suntech Heat, Air and Plumbing","note":"Edmond-based local brand serving the Oklahoma City metro since 1986; its long tenure and Turnpoint platform affiliation make it a high-value CSR/call-center prospect."},{"trades":"HVAC, plumbing, electrical","parent":"Wrench Group, LLC (Leonard Green & Partners)","type":"pe_rollup_brand","company":"Comfort Wave Home Services","note":"Wrench's greenfield OKC entry opened in November 2023; Comfort Wave covers all three trades and planned 100 new local jobs in its first 15 months."},{"trades":"HVAC, plumbing, electrical","parent":"Independent/operator-owned Paschal Air, Plumbing & Electric","type":"large_independent","company":"Paschal Air, Plumbing & Electric (formerly Patriot Heat & Air in OKC)","note":"Paschal has an Oklahoma City-area operation and acquired Oklahoma City-based Patriot Heat & Air in September 2024, adding a recent acquisition-led local platform with all-three-trade coverage."},{"trades":"Plumbing","parent":"Neighborly (KKR; 2021 acquisition, with no subsequent sale identified in the reviewed sources)","type":"franchise","company":"Mr. Rooter Plumbing of Oklahoma City","note":"Dedicated local Neighborly plumbing operator at 8132 West Reno Avenue; it combines a concrete OKC service footprint with the scale and centralized marketing of a national franchise system."},{"trades":"HVAC, plumbing, electrical","parent":"independent (family-owned)","type":"large_independent","company":"Drabek & Hill","note":"One of Oklahoma's oldest and largest family-owned HVAC, plumbing and electrical contractors, serving the Oklahoma City metro since 1961."}],"rollup_activity":"Paschal Air, Plumbing & Electric acquired Oklahoma City-based Patriot Heat & Air on September 5, 2024, while Wrench Group launched Comfort Wave's first Oklahoma City location in November 2023 with a plan for 100 new jobs in its first 15 months. At the platform level, Trivest sold Turnpoint Services to OMERS Private Equity in 2025, changing the sponsor behind local Suntech."},"slc":{"market_snapshot":"The four-county catchment is a large Wasatch Front residential market with ongoing housing demand: the Weber-Davis multi-county area alone reached 647,197 residents in 2023 (18.7% of Utah), while a July 2025 housing report listed 4,093 units for Salt Lake County even as Utah residential construction declined in 2024. Consolidation is already meaningful—ARS combined five Salt Lake-area companies into Yes! in June 2023, and Knox Lane-backed Any Hour Group reports 21 brands in more than 29 locations, alongside Bestige/Intermountain and Apex/Whipple. Service demand is recurring and seasonal: heating and cooling degree days are standard measures of building heating/cooling needs, and the expanding housing base creates continuing repair, replacement, plumbing, and electrical workloads; the last clause is market synthesis rather than a published metro revenue estimate.","buyers":[{"trades":"HVAC, plumbing, electrical, insulation","parent":"American Residential Services / ARS Rescue Rooter (GI Partners; majority owner reported in March 2026)","type":"pe_rollup_brand","company":"Yes! Heating, Air Conditioning, Plumbing & Electric","note":"ARS merged five Salt Lake-area companies into the Yes! brand in June 2023; the announcement described 250+ employees and all core residential trades."},{"trades":"HVAC, plumbing, electrical, drain","parent":"Any Hour Group (Knox Lane)","type":"pe_rollup_brand","company":"Black Diamond Experts","note":"A prominent multi-trade Salt Lake/Ogden operator; Any Hour Group is Knox Lane-backed with 21 brands across 29+ locations, and Black Diamond joined the group in July 2023."},{"trades":"HVAC, plumbing, electrical","parent":"Apex Service Partners (Alpine Investors; Apollo Funds minority investment announced May 2026)","type":"pe_rollup_brand","company":"Whipple Service Champions","note":"Salt Lake service brand operating since 1947; PitchBook reports Apex acquired Whipple on July 29, 2021, making it a clear Apex platform target."},{"trades":"HVAC, plumbing, electrical, water treatment","parent":"Bestige Holdings (Intermountain Home Services is listed as a current investment)","type":"pe_rollup_brand","company":"Intermountain Home Services (local brands include Superior Water & Air, Beehive, and SameDay)","note":"Salt Lake-based multi-brand platform trusted by 350,000+ homeowners in Utah and Idaho; its site explicitly describes disciplined acquisitions and broad core-trade coverage."},{"trades":"HVAC, plumbing, electrical, generators","parent":"independent (the company describes itself as locally owned/operated; no PE parent was identified in the reviewed sources)","type":"large_independent","company":"Mountain Home Services","note":"Long-running Northern Utah multi-trade operator serving Greater Salt Lake City since 1954; the reviewed sources did not publish employee or revenue scale, so it is a large-independent target candidate rather than a verified size ranking."}],"rollup_activity":"In June 2023, ARS/Rescue Rooter consolidated ARS/Rescue Rooter, ESCO, Absolute Air, Captain Electric, and OyBoy Heating and Cooling into Yes! in the greater Salt Lake City area, with 250+ employees reported. In July 2023 Any Hour (Knox Lane) joined forces with Black Diamond, and in November 2025 Any Hour Group acquired Lee's Plumbing in northern Utah—evidence of continuing local and regional roll-up activity."},"miami":{"market_snapshot":"Miami-Dade, Broward, and Palm Beach comprise a roughly 6.14-million-person three-county market on the 2020 population figure returned by the research (6,138,333); the evidence gathered did not provide a clean, comparable 2025 three-county total. Consolidation is material: PitchBook data cited in October 2024 put private-equity purchases of HVAC, plumbing, and electrical companies at nearly 800 since 2022. The demand thesis is partly an operating inference rather than a Miami-specific revenue statistic: South Florida's heat and humidity make cooling a recurring need, while storm/flood exposure, a large existing housing base, and multi-trade service calls support plumbing and electrical demand; local operators explicitly market these combined services.","buyers":[{"trades":"HVAC, plumbing","parent":"Wrench Group","type":"pe_rollup_brand","company":"Lindstrom Air Conditioning & Plumbing","note":"Wrench Group's February 2024 announcement describes Lindstrom as a Southeast Florida home-services leader that joined the group, making it a directly evidenced roll-up target in the metro's broader South Florida market."},{"trades":"HVAC, refrigeration, plumbing","parent":"Flint Group (sponsor not identified in the retrieved evidence)","type":"pe_rollup_brand","company":"Air Around the Clock","note":"A May 2026 report says Flint Group acquired this South Florida-based, nearly 40-year-old HVAC, refrigeration, and plumbing provider; the retrieved excerpt did not specify the county, so county-level Miami coverage should be checked before outreach."},{"trades":"HVAC","parent":"Exuma Capital Partners (Anthony Perera)","type":"pe_rollup_brand","company":"Air Pros USA","note":"The Air Pros site is based in Coral Springs, and a March 2026 report says founder Anthony Perera reacquired the legacy Florida operations through Exuma in June 2025; this is a current post-reacquisition platform lead."},{"trades":"HVAC, plumbing, electrical (network-wide; the local locator explicitly showed plumbing/electrical)","parent":"ARS/Rescue Rooter network (current sponsor not established in the retrieved evidence)","type":"franchise","company":"ARS/Rescue Rooter Miami","note":"ARS's Florida locator returned five providers, including a Miami listing, and explicitly displayed plumbing and electrical services, making it a credible national-network target for multi-trade CSR software."},{"trades":"Plumbing","parent":"Neighborly (KKR announced an acquisition in 2021; current 2025-26 sponsor was not independently re-verified in the retrieved evidence)","type":"franchise","company":"Mr. Rooter Plumbing — North Miami Beach","note":"The official local page says licensed local plumbers are available 24/7 in North Miami Beach; Neighborly materials identify Mr. Rooter and Mr. Electric among its home-service brands."},{"trades":"HVAC / air conditioning","parent":"independent","type":"large_independent","company":"John C. Cassidy Air Conditioning","note":"A current search result describes it as the largest independent family-owned AC contractor in South Florida; the evidence gathered did not establish exact employee or branch counts."}],"rollup_activity":"Consolidation is visible in at least three recent events: Lindstrom Air Conditioning & Plumbing joined Wrench Group in February 2024; Air Pros founder Anthony Perera reacquired the legacy Florida operations through Exuma in June 2025; and Flint Group acquired South Florida-based Air Around the Clock in May 2026. The Air Around the Clock excerpt did not specify a Miami-Dade, Broward, or Palm Beach county, so that transaction is best treated as a South Florida platform-entry signal pending county-level diligence."},"seattle":{"market_snapshot":"King, Pierce and Snohomish counties together represent about 4.05 million people on PSRC's regional profile (2,287,050 + 928,200 + 837,800), and the HVAC opportunity is expanding: 53% of homes in the three counties had air conditioning in 2021, up from 44% in 2019. The operating market still looks locally fragmented, but consolidation is unmistakable—PE-backed platforms are buying local brands such as Seatown and BelRed, while PitchBook data cited in 2024 counted nearly 800 PE purchases of HVAC, plumbing and electrical companies since 2022; cooling adoption and heat-pump/efficiency retrofit work are the clearest demand tailwinds, alongside recurring plumbing and electrical calls.","buyers":[{"trades":"HVAC, plumbing, electrical","parent":"Apex Service Partners (Alpine Investors; Apollo Funds strategic minority investment announced May 2026)","type":"pe_rollup_brand","company":"BelRed Energy Solutions (BelRed)","note":"Seattle/Puget Sound brand; the available 2026 industry transaction dossier dates Apex's acquisition to January 2022, while BelRed currently markets all three trades in Seattle."},{"trades":"HVAC, plumbing, electrical","parent":"Champions Group / Service Champions (Odyssey Investment Partners)","type":"pe_rollup_brand","company":"Seatown Electric, Plumbing, Heating & Air","note":"Service Champions entered the Pacific Northwest by acquiring Seatown on June 12, 2023; Seatown serves King and Snohomish counties and is a strong local multi-trade platform brand."},{"trades":"Plumbing, drain cleaning, sewer lines locally; HVAC and electrical at the national platform","parent":"American Residential Services (ARS)/Rescue Rooter national platform","type":"franchise","company":"Rescue Rooter Seattle","note":"ARS lists a Seattle-area branch in Pacific, Washington; the local listing is plumbing/sewer-led, but the parent network markets HVAC, plumbing and electrical services nationally."},{"trades":"Plumbing, drain cleaning","parent":"Neighborly (KKR; July 2021 acquisition announcement is the latest public ownership source located)","type":"franchise","company":"Mr. Rooter Plumbing of Seattle","note":"The Seattle franchise had expanded to three branches by October 2025, making it a meaningful local plumbing call-center target even though the franchise is not a full three-trade operator."},{"trades":"HVAC, plumbing, electrical","parent":"independent (locally owned; no PE parent identified in the reviewed sources)","type":"large_independent","company":"Harts Services","note":"Tacoma-based local operator with a broad residential plumbing, sewer/drain, electrical, heating and cooling offering; its multi-trade mix makes it a natural CSR/dispatch software buyer."},{"trades":"HVAC / home-energy services","parent":"No parent publicly identified in the 2026 profile reviewed (independence not conclusively proven)","type":"large_independent","company":"Washington Energy Services","note":"Long-running Lynnwood/Puget Sound HVAC operator serving Seattle since 1957 and described as one of Washington's largest HVAC companies; it is a sizable single-trade target even without a verified PE parent."}],"rollup_activity":"Odyssey acquired Service Champions in January 2021, and the platform entered Seattle by acquiring Seatown on June 12, 2023; a 2026 industry dossier lists BelRed Energy Solutions (Seattle/Puget Sound) as acquired by Apex in January 2022. The broader consolidation backdrop remains active: PitchBook data cited in October 2024 counted nearly 800 PE purchases of HVAC, plumbing and electrical companies since 2022, and Apex announced a strategic minority investment from Apollo Funds on May 28, 2026."},"tucson":{"market_snapshot":"Pima County/Tucson is a sizable, growing residential base: the 2023 assessment reports 561,548 people and 250,561 housing units, projects 603,724 people by 2045, and estimates 62,403 new housing units needed from 2024-2045, including 49,625 units of future need. The documented market is consolidating but not fully rolled up—Rite Way/Redwood and Wrench/Parker & Sons have made platform moves while family-owned Chas Roberts and Hamstra remain meaningful local operators—and extreme summer heat produces acute AC demand, with local reporting describing a surge in service calls; population and housing growth support ongoing plumbing and electrical demand as well.","buyers":[{"trades":"HVAC, plumbing, electrical","parent":"Redwood Services (Altas Partners investment announced May 2025)","type":"pe_rollup_brand","company":"Rite Way Heating, Cooling & Plumbing","note":"One of Tucson's largest residential providers, serving over 13,000 active residential customers; it acquired Southern Arizona Plumbing in October 2022."},{"trades":"HVAC, plumbing, electrical","parent":"Wrench Group (Leonard Green & Partners; TSG Consumer Partners; Oak Hill Capital)","type":"pe_rollup_brand","company":"Parker & Sons","note":"Wrench opened Parker & Sons' greenfield Tucson location on February 23, 2022 at 3801 N. Hwy Drive; the brand offers full-trade residential service."},{"trades":"HVAC","parent":"Authority Brands (franchisor; Benjamin Franklin Plumbing is a sister brand)","type":"franchise","company":"Superior One Hour Heating & Air Conditioning of Tucson","note":"A locally owned Tucson franchise operated by Elizabeth and Kenzy Cerveri; Authority Brands officially lists One Hour and Benjamin Franklin Plumbing in its home-service brand family."},{"trades":"HVAC, plumbing","parent":"Independent / family-owned; no PE parent publicly identified in the reviewed 2025-2026 sources","type":"large_independent","company":"Chas Roberts Air Conditioning, Inc.","note":"Arizona's largest HVAC provider, with eight locations including Tucson; the company has been family-owned and operated since its 1942 founding and also offers plumbing."},{"trades":"HVAC","parent":"Independent (family-owned)","type":"large_independent","company":"Hamstra Heating & Cooling","note":"A long-standing Tucson operator serving the area since November 1983; its public profile describes it as family-owned and operated with more than 60 Tucson employees."},{"trades":"HVAC, plumbing","parent":"Independent / no parent listed in the current company profile","type":"large_independent","company":"Alaskan Air Conditioning & Heating","note":"A Tucson/Phoenix operator founded in 1972; its Tucson service page covers AC and heating, while its company profile identifies plumbing and offices in both cities."}],"rollup_activity":"Rite Way announced the acquisition of Southern Arizona Plumbing on October 5, 2022; Rite Way is listed as a Tucson partner of Redwood Services, which announced a significant equity investment from Altas Partners in May 2025. Separately, Wrench Group made a greenfield Tucson entry with Parker & Sons on February 23, 2022 at 3801 N. Hwy Drive; Wrench's sponsor update names Leonard Green & Partners, TSG Consumer Partners, and Oak Hill Capital."},"abq":{"market_snapshot":"The three-county footprint is a sizeable existing-home market: Albuquerque city was estimated at 556,588 residents on July 1, 2025, and Bernalillo County alone had 306,879 housing units and a 64.5% owner-occupied rate for 2020-2024. Census has current 2020-25 population and housing-estimate series, but the retrieved material did not provide a defensible combined Bernalillo/Sandoval/Valencia growth rate, so I do not claim positive growth. The reviewed local roster is visibly fragmented—several leading brands describe local or family ownership, while the clearest national-platform local brand found is Neighborly's independently owned Mr. Rooter—and demand should be resilient from year-round repair/emergency work plus seasonal heating and cooling; that last demand statement is an evidence-based synthesis, not a published market-size estimate.","buyers":[{"trades":"Plumbing, drain/sewer, septic","parent":"Neighborly / Neighborly Assetco LLC (franchisor; local franchise independently owned)","type":"franchise","company":"Mr. Rooter Plumbing of Albuquerque","note":"Verified local Neighborly franchise with an Albuquerque residential service page; the national platform supplies brand, operating playbook, and cross-brand lead infrastructure."},{"trades":"HVAC, plumbing, electrical","parent":"independent / locally owned and managed (no PE parent publicly identified)","type":"large_independent","company":"TLC Plumbing Heating Cooling Electrical","note":"Long-established local full-service brand: its site says it has operated for more than 35 years and serves Albuquerque, Santa Fe, and Rio Rancho, with 24-hour emergency coverage."},{"trades":"HVAC, plumbing, electrical","parent":"independent / locally owned family company (no PE parent publicly identified)","type":"large_independent","company":"Albuquerque Plumbing, Heating & Cooling (ABQ Plumb)","note":"Local 24/7/365 full-service operator covering plumbing, HVAC, and electrical needs; its site says homeowners have trusted it since 2008."},{"trades":"HVAC, plumbing, electrical","parent":"independent / local owner-manager (Richard Walter; no PE parent publicly identified)","type":"large_independent","company":"Signature Heating, Cooling, Plumbing & Electrical","note":"Residential full-service provider throughout Albuquerque; the operator page confirms all three core trades and BBB identifies Richard Walter as owner/manager."},{"trades":"HVAC, plumbing","parent":"independent / family-owned (Bill Collins, owner)","type":"large_independent","company":"Academy Plumbing, Heating & Air Conditioning","note":"Employee-/family-owned local plumbing and heating/air-conditioning business; a credible call-center target, although less public scale data is available than for TLC."}],"rollup_activity":"Publicly documented Albuquerque-area M&A is commercial rather than residential: Pueblo Mechanical & Controls acquired Albuquerque-based Travers Mechanical Services in July 2022, and the sources describe Travers/Pueblo as commercial HVAC/plumbing businesses; Huron Capital describes the strategy as a commercial HVAC/plumbing buy-and-build. OMERS announced its agreement to acquire Pueblo on August 5, 2022; I found no publicly verified 2025-26 residential acquisition or new PE platform entry in the three-county footprint, so no PE roll-up brand is included above."},"omaha":{"market_snapshot":"Within the requested Douglas–Sarpy–Pottawattamie footprint, public indicators point to a large, growing market: the broader Omaha MSA was estimated at 987,800 people in 2021 and had grown 1.1% annually since 2010, while Omaha's 2025 housing report says Omaha and the metro area grew 12.8% since 2010 and Omaha issued 3,371 residential-unit permits in 2024. Demand is supported by new construction, a largely occupied housing base (418,309 MSA units in 2023, about 95% occupied), and urgent/recurring heating, cooling, plumbing and electrical work; the housing-market index rose from 75.5 to 76.2 from January 2024 to January 2025 and Omaha ranked sixth for housing demand. Consolidation is meaningful but incomplete: the latest public disclosures identify Omaha-serving PE-platform brands (Burton and John Henry), Authority Brands and Neighborly franchises, and sizable locally owned multi-trade shops.","buyers":[{"trades":"HVAC, plumbing, electrical","parent":"LightBay Capital (December 2021 growth investment; ShoreView was also disclosed in Burton's 2021 acquisition releases)","type":"pe_rollup_brand","company":"Just Call Burton / Burton A/C, Heating, Plumbing & Electrical","note":"Omaha-based full-service brand with regional roll-up activity; the public record located does not expressly re-document its ownership after the 2021 LightBay/ ShoreView disclosures, so current sponsor status should be confirmed before outreach."},{"trades":"HVAC, plumbing, electrical","parent":"Legacy Service Partners (Gridiron Capital; investment/partnership announced April–May 2023)","type":"pe_rollup_brand","company":"John Henry's Plumbing, Heating, Air & Electrical","note":"Family-origin operator serving Lincoln and Omaha since 1996, with an Omaha operating footprint; Legacy's investment makes it a high-priority platform prospect, although no later 2025–26 ownership change was located."},{"trades":"HVAC","parent":"Authority Brands (One Hour Heating & Air Conditioning franchisor)","type":"franchise","company":"McCarthy's One Hour Heating & Air Conditioning","note":"Locally owned/operated One Hour franchise serving Omaha and Council Bluffs with heating, cooling, repair, installation and maintenance services."},{"trades":"Plumbing","parent":"Neighborly (Mr. Rooter Plumbing franchise network)","type":"franchise","company":"Mr. Rooter Plumbing of Omaha","note":"Local Neighborly plumbing operator serving Omaha and multiple Douglas/Sarpy communities, with drain, sewer-line, repair and emergency-plumbing demand."},{"trades":"HVAC, plumbing, electrical (plus appliance repair and generators)","parent":"Locally owned; no disclosed PE or franchisor parent","type":"large_independent","company":"ServiceOne Heating, Cooling, Plumbing & Electrical","note":"30-plus years in the Omaha/Council Bluffs market and 55–60 licensed technicians; its one-brand, multi-trade model is a natural call-center/CSR software target."},{"trades":"HVAC, plumbing","parent":"No disclosed PE or franchisor parent (local operator; independence is not expressly stated on the cited page)","type":"large_independent","company":"Thermal Heating, Air & Plumbing","note":"Established in 1968, reports more than 100 technicians, and serves Omaha, Bellevue, Papillion and Council Bluffs—strong local scale even though a parent-company relationship is not publicly identified."}],"rollup_activity":"The Omaha-linked consolidation record found is concentrated in 2021–2023: Omaha-headquartered Burton acquired Lincoln-based Star City Heating & Cooling in March 2021 and Holland Heating & Air/Mr. Holland's Electric in July 2021, followed by LightBay's Burton growth investment announced December 14, 2021; Legacy Service Partners announced its John Henry's investment/partnership on April 3 and May 2, 2023. I found no publicly announced 2024–2026 acquisition specifically inside Douglas, Sarpy or Pottawattamie counties in the searched sources, so the 2021–2023 items should be read as Omaha-linked/regional platform activity rather than all as in-county transactions."},"desmoines":{"market_snapshot":"Greater Des Moines has a meaningful and growing residential-service base: the broader regional partnership reports 13.4% population growth over the last decade, while a housing profile covering Dallas, Madison, Polk and Warren counties reports that more than 27% of housing units were built after 2000. In the defined Polk-Dallas-Warren footprint, the competitive picture appears mixed and still locally fragmented rather than dominated by one national roll-up, combining a reported Heartland transaction, multi-market Golden Rule, a Neighborly franchise and several long-standing independents; recurring seasonal heating/cooling loads plus plumbing, electrical and equipment-replacement work are the core service-demand drivers.","buyers":[{"trades":"HVAC","parent":"Merit Management Group (reported acquirer on Nov. 15, 2025; PE/sponsor characterization not confirmed)","type":"pe_rollup_brand","company":"Heartland Heating & Cooling","note":"Current Des Moines/Grimes operator; Preqin reports the 2025 acquisition, but the company site still says locally owned, so the sponsor relationship should be treated as reported and not fully reconciled."},{"trades":"HVAC, plumbing, electrical","parent":"independent (privately held; Mark and Miranda Paup)","type":"large_independent","company":"Golden Rule Plumbing, Heating, Cooling & Electrical","note":"Operates a 100-plus-vehicle fleet across the Des Moines, Omaha and Salt Lake City metros, giving it unusually large multi-market scale for an independent target."},{"trades":"HVAC, plumbing, electrical","parent":"independent (Brian Leech, owner)","type":"large_independent","company":"Service Legends","note":"Established Central Iowa residential brand spanning heating, cooling, plumbing and related home-comfort services; its local ownership makes it a direct CSR/call-center prospect."},{"trades":"HVAC, plumbing","parent":"independent (Randy Keys / Dennis Lane; no current sponsor verified)","type":"large_independent","company":"Schaal Plumbing, Heating & Cooling","note":"A 2020 industry profile described Schaal as a 70-person Des Moines business; employee owners bought it in 2014, indicating meaningful local operating scale without a verified current roll-up parent."},{"trades":"HVAC, plumbing","parent":"independent (Jason Gassmann; sole owner reported in 2020)","type":"large_independent","company":"Bell Brothers Heating, Cooling & Plumbing","note":"Long-standing Des Moines operator; a 2020 report said Gassmann became sole owner, and the local brand markets both HVAC and plumbing services."},{"trades":"HVAC","parent":"Neighborly (Aire Serv franchisor)","type":"franchise","company":"Aire Serv of NW Des Moines","note":"Confirmed Urbandale-area Neighborly franchise and a clean local entry point into a national home-services network; franchises are independently operated but benefit from shared brand and support infrastructure."}],"rollup_activity":"The clearest recent transaction is Heartland Heating & Cooling: Preqin reports that Merit Management Group acquired it on November 15, 2025, with expansion into wider markets planned; a separate market-data result also lists Merit investments in Metro Heating & Cooling (Des Moines) and Heartland. No reliable 2025-26 announcement found in the research tied the defined metro to Apex, Wrench, Turnpoint, Leap, Sila, Horizon or ARS; Bell Brothers' 2020 ownership transfer and Schaal's 2014 employee buyout are older local succession events rather than recent roll-up activity."},"louisville":{"market_snapshot":"HUD's broader Louisville, KY-IN metropolitan area (which is larger than the five-county perimeter specified here) was estimated at 1.33 million people on October 1, 2024; population growth averaged 0.1% annually from 2020, while single-family permits rose 11% to 3,400 in the year ending September 2024. The residential-trades opportunity is therefore a large, relatively slow-growing installed base with active new construction and recurring heating/cooling, plumbing, and electrical repair or replacement demand; the industry remains fragmented, but PE-backed platforms, franchises, and multi-brand operators are consolidating service capacity. An exact five-county population total was not established in the sources reviewed, so the 1.33 million figure should be treated as broader-MSA context rather than a precise total for Jefferson, Oldham, Bullitt, Clark, and Floyd counties.","buyers":[{"trades":"HVAC, plumbing","parent":"Wrench Group (Leonard Green & Partners/management majority; TSG Consumer Partners and Oak Hill minority in the last disclosed Nov. 2022 transaction; no newer change identified)","type":"pe_rollup_brand","company":"Jarboe's Plumbing, Heating & Cooling","note":"Wrench's official materials identify Jarboe's as its Greater Louisville brand, serving heating, cooling, and plumbing since 1986; its own site also markets electrical service."},{"trades":"HVAC, plumbing","parent":"Turnpoint Services (OMERS Private Equity acquired Turnpoint in Nov. 2020; no newer change identified)","type":"pe_rollup_brand","company":"Dauenhauer Plumbing | Heating & Air","note":"Turnpoint's current brand page places Dauenhauer in Louisville and Lexington, serving the market since 1958 and operating seven days a week."},{"trades":"HVAC, plumbing, electrical","parent":"Len The Plumber (PE-backed operating parent; current sponsor not publicly confirmed in the reviewed sources)","type":"pe_rollup_brand","company":"Tom Drexler Plumbing, Air & Electric","note":"Tom Drexler is an active Louisville/Southern Indiana multi-trade brand; PitchBook identifies it as acquired by Len The Plumber, an operating subsidiary with private-equity-backed status."},{"trades":"HVAC, plumbing, electrical","parent":"American Residential Services / ARS (GI Partners; majority investment announced in 2020; no newer change identified)","type":"pe_rollup_brand","company":"ARS/Rescue Rooter — Louisville","note":"ARS's official Kentucky locator lists a Louisville branch at 2815 Watterson Trail and HVAC, plumbing, and electrical services; ARS is a national residential-services platform."},{"trades":"plumbing","parent":"Authority Brands (franchisor)","type":"franchise","company":"Benjamin Franklin Plumbing — Eastern Louisville","note":"The official local page lists an Eastern Louisville location at 3832 Taylorsville Road, 24/7 answering, and license M7523; Authority Brands owns the Benjamin Franklin Plumbing franchise brand."},{"trades":"HVAC, electrical, plumbing, remodeling","parent":"independent (family-owned; no PE parent identified in the reviewed sources)","type":"large_independent","company":"Maeser Master Services","note":"Maeser presents itself as family-owned and markets HVAC, electrical, plumbing, and remodeling services in the Louisville/Lexington area, with a stated 1975 heritage."}],"rollup_activity":"The most clearly documented Louisville-area consolidation steps were Wrench Group's Midwest partnership that listed Jarboe's in June 2021, Jarboe's acquisition of Pacific Plumbing in January 2021, HomeServe's acquisition of Louisville-based United Plumbing in January 2022, and Len The Plumber's acquisition of Tom Drexler in April 2022. I did not find a later 2023-2026 Louisville-specific transaction that was sufficiently identified in the reviewed public sources; Southern Home Services' 2026 Dunn's announcement was identified as an Alabama deal, so it was not used as evidence of a Louisville operating brand."},"richmond":{"market_snapshot":"Richmond City plus Henrico, Chesterfield, and Hanover sit in a roughly 1.3 million-person MSA; the broader Richmond area grew from 1.19 million people in 2010 to 1.37 million in 2024 (+15.3%), although projected permits fell to 7,816 units in 2024 from nearly 9,976 in 2023. The market is still locally fragmented—long-standing family-owned operators coexist with PE-backed platforms and franchise networks—while the broader trades sector is consolidating rapidly: PitchBook data cited in 2024 put PE purchases of HVAC, plumbing, and electrical companies at nearly 800 since 2022. Demand is supported by a large homeowner/service base, recurring seasonal heating-and-cooling loads, and urgent plumbing/electrical work; Woodfin reports serving more than 225,000 Richmond homeowners since 1977, and the National Weather Service tracks both heating and cooling degree days for Richmond.","buyers":[{"trades":"HVAC, plumbing","parent":"Southern Home Services (Gryphon Investors)","type":"pe_rollup_brand","company":"Blazer Heating, Air & Plumbing","note":"Southern Home Services acquired this 37-year-old locally owned Richmond operator on May 19, 2026, creating the clearest new PE-backed platform footprint in the metro."},{"trades":"HVAC, plumbing, electrical","parent":"American Residential Services (GI Partners)","type":"pe_rollup_brand","company":"ARS/Rescue Rooter of Richmond","note":"The Richmond operation is identified at a Chester address in the target geography; ARS markets all three trades nationally and GI Partners was reported as its majority owner in March 2026."},{"trades":"HVAC, plumbing, electrical","parent":"Service Experts platform (current parent/sponsor not publicly disclosed in the reviewed sources)","type":"pe_rollup_brand","company":"Service Experts Heating & Air Conditioning — Greater Richmond","note":"Its official Richmond page markets all three trades; the platform reports 75+ locations and acquired 19 HomeServe service centers in 2024, making it a high-value call-center target despite the unresolved current sponsor."},{"trades":"HVAC, plumbing, electrical","parent":"Authority Brands (franchisor)","type":"franchise","company":"One Hour Heating & Air Conditioning / Benjamin Franklin Plumbing / Mister Sparky — Richmond","note":"The local East/West Richmond and Midlothian pages show a multi-brand, 24/7 franchise cluster spanning HVAC, plumbing, and electrical, giving one franchise operator several AI-CSR use cases."},{"trades":"HVAC, plumbing, electrical","parent":"independent (family-owned)","type":"large_independent","company":"Woodfin — Your Home Team","note":"A major Richmond incumbent: family-owned, serving more than 225,000 Richmond homeowners since 1977, with explicit coverage of Henrico, Chesterfield, and Hanover."},{"trades":"HVAC, plumbing, electrical","parent":"independent (family-owned; Basim Mansour identified as owner)","type":"large_independent","company":"Michael & Son Services — Richmond","note":"Founded in 1976 and still described through its family-business history, Michael & Son has a substantial regional multi-trade platform and a dedicated Richmond operation."}],"rollup_activity":"On May 19, 2026, Gryphon-backed Southern Home Services acquired Blazer Heating, Air & Plumbing, a 37-year-old locally owned Richmond company, putting a PE-backed house of brands directly into the metro. That transaction fits the national consolidation pattern: PitchBook data cited in October 2024 said PE investors had purchased nearly 800 HVAC, plumbing, and electrical companies since 2022; no additional Richmond-metro transaction was confirmed in the reviewed sources."},"greenville":{"market_snapshot":"Using July 1, 2025 Census estimates, the user-defined four-county footprint totals 1,323,110 residents (Greenville 583,125; Spartanburg 380,857; Anderson 219,930; Pickens 139,198). Growth and housing signals are strong: HUD’s Greenville-Anderson-Mauldin HMA (a slightly different geography) estimated 970,300 people and demand for 15,000 new homes, while Pickens County permitted 1,050 sales units in 2024, up 81% from 2023. The market is meaningfully consolidated but still fragmented—TurnPoint/OMERS and Gryphon-backed Southern Home Services sit alongside sizeable family-owned independents; new construction plus likely recurring repair/replacement and emergency work drives demand for centralized CSR capacity.","buyers":[{"trades":"HVAC, plumbing, electrical","parent":"TurnPoint Services (OMERS Private Equity)","type":"pe_rollup_brand","company":"Corley Plumbing Air Electric","note":"Greenville brand operating since 1986; TurnPoint announced its acquisition in December 2019 (closed December 3) and the brand covers all three residential trades."},{"trades":"HVAC, plumbing, electrical","parent":"Southern Home Services / Southern HVAC Corp. (majority-owned by Gryphon Investors)","type":"pe_rollup_brand","company":"Five Star Plumbing Heating Cooling & Electrical","note":"Greenville-based Upstate brand serving homeowners since 1984; Southern acquired it in April 2021 and later added Spartanburg’s George M. Hill & Sons to the platform."},{"trades":"Plumbing and drain cleaning","parent":"Neighborly (Mr. Rooter Plumbing franchise network)","type":"franchise","company":"Mr. Rooter Plumbing of Greenville","note":"The Greenville territory markets drain cleaning, water-heater repair and 24/7 emergency plumbing, while the Neighborly network describes Mr. Rooter as one of North America’s largest full-service plumbing/drain-cleaning brands."},{"trades":"HVAC, plumbing, electrical","parent":"independent (family-owned; explicitly not PE-owned)","type":"large_independent","company":"Preferred Home Services","note":"Provides all three trades across Greenville and the Upstate; its own current materials explicitly say it is family-owned and not owned by a private-equity firm."},{"trades":"HVAC, plumbing, electrical","parent":"independent / no parent publicly identified in reviewed sources","type":"large_independent","company":"Dipple Plumbing, Electrical, Heating & Air","note":"A durable local full-service brand founded in 1979 that says it has served Upstate South Carolina for more than 45 years."},{"trades":"HVAC, plumbing, electrical","parent":"independent / no parent publicly identified in reviewed sources","type":"large_independent","company":"Davis Services, Inc.","note":"Reports more than 100 employees and over 80 trucks/vans serving Upstate South Carolina and the foothills of North Carolina—unusually strong independent scale for a CSR software target."}],"rollup_activity":"TurnPoint entered Greenville by acquiring Corley Plumbing Air Electric (announced December 6, 2019; transaction closed December 3, 2019); current ownership is OMERS Private Equity after Trivest Fund V’s sale. Southern HVAC/Southern Home Services acquired Greenville-based Five Star in April 2021 and Spartanburg-based George M. Hill & Sons on March 21, 2023, while Southern remained Gryphon-backed in 2026."},"tulsa":{"market_snapshot":"The four requested counties total about 941,036 residents using the U.S. Census July 1, 2025 estimates (Tulsa 698,782; Rogers 102,197; Wagoner 93,263; Osage 46,794). Tulsa's housing data is a positive demand signal: the city permits about 830 housing units per year versus 1,290 needed to meet demand. The market is fragmented but actively consolidating into multi-brand and regional platforms, while recurring heating/cooling, plumbing and electrical repair demand is supported by Tulsa's 823 average heating degree days and ongoing housing needs.","buyers":[{"trades":"HVAC, plumbing, electrical (platform; local-brand coverage varies)","parent":"HomeTown Services (CenterOak Partners and Churchill Asset Management listed as investors; control terms not publicly clear)","type":"pe_rollup_brand","company":"HomeTown Services Tulsa brands: Air Assurance / Mullin Plumbing","note":"HomeTown's portfolio lists Air Assurance in Tulsa and Mullin Plumbing in Tulsa; public transaction profiles date their acquisitions to November 3, 2021 and December 10, 2021, making this a key multi-brand platform target."},{"trades":"HVAC, plumbing, heating","parent":"Redwood Services (Altas Partners equity investor since 2025; Union Main Group founding backer)","type":"pe_rollup_brand","company":"Hendrick Heat, Air & Plumbing","note":"Redwood announced its first Oklahoma investment on July 7, 2026; Hendrick serves more than 25,000 greater-Tulsa customers, employs over 90 people, and joined Redwood's 20-plus-company network."},{"trades":"HVAC, plumbing, electrical","parent":"independent (locally and family owned, self-described)","type":"large_independent","company":"Quality Heating, Cooling, Plumbing & Electric","note":"The Glenpool-based operator reports locations in Glenpool, Tulsa and Bartlesville, service since 2014, and an acquisition of Tulsa's Reed Family Heating & Air; it has also added electrical service."},{"trades":"HVAC, plumbing, electrical","parent":"independent (Paschal says it is not private-equity-owned)","type":"large_independent","company":"Paschal Air, Plumbing & Electric (including the Robison Air Tulsa brand)","note":"Paschal has an explicit Tulsa location and multi-trade service offering and announced the Robison Air acquisition/Tulsa expansion in December 2025, creating a substantial regional platform target."},{"trades":"HVAC","parent":"Neighborly (franchisor)","type":"franchise","company":"Aire Serv of South Tulsa","note":"The local Bixby-based Aire Serv is BBB-accredited and serves South Tulsa; official Aire Serv/Neighborly materials identify Aire Serv as a Neighborly company."},{"trades":"HVAC, electrical, plumbing","parent":"Ownership unresolved: Airco says third-generation family-owned, while HomeTown Services lists Airco Service in its brand portfolio","type":"large_independent","company":"Airco Service","note":"Established in 1961, Airco describes itself as the largest Northeastern Oklahoma family-owned and operated residential/commercial HVAC, electric and plumbing company; the conflicting HomeTown listing means its 2025-2026 parent should be confirmed directly before treating it as a HomeTown-controlled brand."}],"rollup_activity":"Public transaction profiles record HomeTown Services' acquisitions of Air Assurance (November 3, 2021) and Mullin Plumbing (December 10, 2021); Quality separately announced its acquisition of Reed Family Heating & Air of Tulsa. Paschal announced the Robison Air/Tulsa expansion in December 2025, and Redwood announced its first Oklahoma investment in Tulsa's Hendrick Heat, Air & Plumbing on July 7, 2026. No verified Tulsa operating brand for Apex, Wrench, Turnpoint, Leap, Sila, Horizon or ARS/Rescue Rooter was found in the evidence gathered, so those platforms are not presented as local buyers."},"cosprings":{"market_snapshot":"The El Paso–Teller footprint is a roughly 782,000-person residential market: El Paso County had 757,040 people and 320,334 housing units on July 1, 2025, while Teller County's 2025 population was 24,756; El Paso's owner-occupied rate was 66.2% in 2020–2024. Growth and service demand have durable support from a Colorado Springs planning projection of more than 250,000 additional El Paso County residents by 2045, in-migration/low-vacancy dynamics, a 1982 median housing-construction year in the available assessment (structural context rather than a current estimate), and seasonal heating/cooling needs. Consolidation is meaningful but incomplete: Air Pros assembled three Colorado Springs operators in 2020, while the current field still includes a Neighborly franchise and multiple family- or woman-owned independents; Air Pros' March 2025 Chapter 11 makes the roll-up's current Colorado ownership unclear.","buyers":[{"trades":"HVAC, plumbing, ductwork (an Air Pros-era source also described electrical)","parent":"Air Pros USA (2020 acquirer; Chapter 11 filed March 16, 2025; current Colorado ownership not publicly confirmed)","type":"pe_rollup_brand","company":"One Source Home Service","note":"The strongest disclosed local platform signal: the 2020 acquisition material described 60 trucks and 115 employees serving Colorado Springs and Pueblo; its current site remains live, but ownership needs diligence after Air Pros' restructuring."},{"trades":"Plumbing and drain cleaning","parent":"Neighborly (franchise network)","type":"franchise","company":"Mr. Rooter Plumbing of Colorado Springs","note":"A d   const TYPE_CLASS = {

  function timeAgo(iso) {
    if (!iso) return "";
    const ms = Date.now() - new Date(iso).getTime();
    if (isNaN(ms)) return "";
    if (ms < 60000) return "new"; // includes future-dated source timestamps
    const m = Math.round(ms / 60000);
    if (m < 60) return m + "m ago";
    const h = Math.round(m / 60);
    if (h < 48) return h + "h ago";
    return Math.round(h / 24) + "d ago";
  }
  function fmtSent(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return esc(iso);
    return d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  }

              "<h3>" + esc(e.headline) + "</h3>" +
              '<div class="metro-line">' + esc(m ? m.name : e.metro) +
                (e.nwsRef && e.nwsRef !== "none" ? " · NWS: " + esc(e.nwsRef) : "") +
                (e.duration ? " · " + esc(e.duration) : "") + "</div>" +
              (e.demand ? '<div class="demand"><b>demand →</b> ' + esc(e.demand) + "</div>" : "") +
              (e.sources.length
                ? '<div class="srcs">' + e.sources.slice(0, 3).map((u) => {
                    let h; try { h = new URL(u).hostname.replace(/^www\./, ""); } catch { h = u; }
                    return '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(h) + "</a>";
                  }).join(" · ") + "</div>"
                : "") +
            "</article>"
          );
        }).join("")
      : '<div class="empty">No events match the current filters.</div>';
  }

  /* ---------- callers tab (live deployment only) ---------- */
  // A caller record mirrors the enrichment pipeline's field set:
  //   identity (reverse phone lookup) → ranked candidate addresses (Task run)
  //   → property details for the chosen address (Task run)
  // The log lives server-side (Vercel Blob, one blob per caller) so it is
  // shared across browsers, devices, and everyone on the team.
  async function loadCallers() {
    const d = await api("/api/callers");
    return d.callers || [];
  }

  // Persist one record. Local state updates immediately; the write is
  // fire-and-forget with the error surfaced in the status line.
  function saveCaller(caller) {
    const record = Object.assign({}, caller);
    delete record.open; // per-viewer UI state, never shared
    return api("/api/callers", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ caller: record }),
    }).catch((e) => setStatus('<span style="color:var(--heat)">save failed — ' + esc(e.message) + "</span>"));
  }

  async function refreshCallers(silent) {
    try {
      const fresh = await loadCallers();
      // Don't clobber a lookup still writing its stages in this tab.
      const inflight = state.callers.filter((c) => c.pending);
      const ids = new Set(inflight.map((c) => c.id));
      state.callers = inflight.concat(
        fresh.filter((c) => !ids.has(c.id)).map((c) => Object.assign(c, { open: state.openCards.has(c.id) }))
      );
      render();
    } catch (e) {
      if (!silent) setStatus('<span style="color:var(--heat)">' + esc(e.message) + "</span>");
    }
  }

  function haversineKm(a, b) {
    const R = 6371, toR = (d) => (d * Math.PI) / 180;
    const dLat = toR(b[1] - a[1]), dLon = toR(b[0] - a[0]);
    const h = Math.sin(dLat / 2) ** 2 +
      Math.cos(toR(a[1])) * Math.cos(toR(b[1])) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }

  function nearestMetro(lonlat) {
    let best = null, bestKm = Infinity;
    for (const m of DATA.metros) {
      if (!m.lonlat) continue;
      const km = haversineKm(m.lonlat, lonlat);
      if (km < bestKm) { bestKm = km; best = m; }
    }
    return best && bestKm <= 100 ? { metro: best, km: Math.round(bestKm) } : null;
  }

  // The address the caller record is "pinned" to: explicit pick, else the
  // highest-ranked street-level residential candidate, else rank 1.
  function chosenAddress(c) {
    if (!c.addresses || !c.addresses.length) return null;
    // Property records are pulled for one specific address — if we have them,
    // that address is what the card is about, so the header must match it.
    if (c.property && c.propertyForRank) {
      const pick = c.addresses.find((a) => a.rank === c.propertyForRank);
      if (pick) return pick;
    }
    if (c.chosenRank) {
      const pick = c.addresses.find((a) => a.rank === c.chosenRank);
      if (pick) return pick;
    }
    return (
      c.addresses.find((a) => a.street_level && a.address_type === "current_residential") ||
      c.addresses.find((a) => a.street_level && /residential|household/.test(a.address_type)) ||
      c.addresses.find((a) => a.street_level) ||
      c.addresses[0]
    );
  }

  function surgeFor(addr) {
    if (!addr || !addr.geo) return null;
    const near = nearestMetro([addr.geo.lon, addr.geo.lat]);
    if (!near) return { outside: true };
    const evts = DATA.events.filter((e) => e.metro === near.metro.id);
    const alerts = DATA.alerts.filter(
      (a) => a.metros.includes(near.metro.id) && a.active && a.category !== "irrelevant"
    );
    return { metro: near.metro, km: near.km, events: evts, alerts: alerts, brief: (DATA.briefs || {})[near.metro.id] };
  }

  /* ---------- map pins for every enriched caller ---------- */
  function renderCallerPins() {
    document.querySelectorAll(".caller-pin").forEach((el) => el.remove());
    const frag = [];
    for (const c of state.callers) {
      const a = chosenAddress(c);
      if (!a || !a.map) continue;
      const sel = state.selCaller === c.id;
      const x = a.map.x, y = a.map.y;
      frag.push(
        '<g class="caller-pin" data-caller="' + esc(c.id) + '" tabindex="0" role="button" ' +
          'aria-label="' + esc(c.person.name) + '">' +
          (sel ? '<circle cx="' + x + '" cy="' + y + '" r="13" fill="none" stroke="var(--accent)" stroke-width="1.3" stroke-dasharray="3 3"></circle>' : "") +
          '<rect x="' + (x - 5) + '" y="' + (y - 5) + '" width="10" height="10" transform="rotate(45 ' + x + " " + y + ')" ' +
            'fill="var(--accent)" stroke="var(--panel)" stroke-width="1.5"></rect>' +
          (sel || state.callers.length <= 12
            ? '<text x="' + x + '" y="' + (y - 13) + '">' + esc(c.person.name.split(" ")[0]) +
              (a.map.precision === "street" ? "" : " ~") + "</text>"
            : "") +
        "</g>"
      );
    }
    if (!frag.length) return;
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.setAttribute("class", "caller-pin-layer");
    document.querySelectorAll(".caller-pin-layer").forEach((el) => el.remove());
    g.innerHTML = frag.join("");
    $("#markers").after(g);
    g.querySelectorAll(".caller-pin").forEach((el) => {
      el.addEventListener("click", () => {
        state.selCaller = el.dataset.caller;
        state.tab = "callers";
        render();
        const card = document.getElementById("caller-" + el.dataset.caller);
        if (card) card.scrollIntoView({ block: "center", behavior: "smooth" });
      });
    });
  }

  /* ---------- lookup pipeline ---------- */
  const spin = '<span class="spin"></span>';

  function setStatus(html) { $("#caller-status").innerHTML = html; }

  // Enrichment is gated: the token arrives once via #t=… in the URL and is
  // kept in localStorage so the link only has to be shared a single time.
  const TOKEN_KEY = "avoca.enrichToken";
  function enrichToken() {
    const m = location.hash.match(/[#&]t=([^&]+)/);
    if (m) {
      try { localStorage.setItem(TOKEN_KEY, decodeURIComponent(m[1])); } catch {}
      history.replaceState(null, "", location.pathname + location.search);
    }
    try { return localStorage.getItem(TOKEN_KEY) || ""; } catch { return ""; }
  }

  async function api(path, opts) {
    const o = opts || {};
    o.headers = Object.assign({}, o.headers, { "x-enrich-token": enrichToken() });
    const res = await fetch(path, o);
    const d = await res.json().catch(() => ({}));
    if (res.status === 401) throw new Error("Enrichment locked — open the site with the access link (…/#t=TOKEN).");
    if (!res.ok) throw new Error(d.error || "HTTP " + res.status);
    return d;
  }

  async function pollRun(runId, kind, onTick) {
    const started = Date.now();
    for (;;) {
      const d = await api("/api/enrich?runId=" + encodeURIComponent(runId) + "&kind=" + kind);
      if (d.status === "completed") return d;
      if (d.status === "failed") throw new Error(kind + " run failed");
      if (onTick) onTick(Math.round((Date.now() - started) / 1000));
      await new Promise((r) => setTimeout(r, 6000));
    }
  }

  async function runLookup() {
    const phone = $("#caller-phone").value.trim();
    const processor = $("#caller-proc").value;
    if (!phone) return;
    const btn = $("#caller-run");
    btn.disabled = true;
    try {
      setStatus(spin + "1/3 identity — reverse phone lookup…");
      const start = await api("/api/enrich", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ phone: phone, processor: processor }),
      });

      const caller = {
        id: "c" + Date.now().toString(36),
        phone: start.phone,
        person: start.person,
        addresses: null,
        identityMatch: "",
        property: null,
        chosenRank: null,
        addressRunId: start.addressRunId,
        enrichedAt: new Date().toISOString(),
        open: true,
        pending: true,
      };
      state.callers.unshift(caller);
      state.selCaller = caller.id;
      state.openCards.add(caller.id);
      await saveCaller(caller);
      render();

      setStatus(spin + "2/3 addresses — researching street-level candidates for " + esc(start.person.name) + "…");
      const addr = await pollRun(start.addressRunId, "addresses", (s) =>
        setStatus(spin + "2/3 addresses — researching candidates for " + esc(start.person.name) + " (" + s + "s)…")
      );
      caller.addresses = addr.addresses || [];
      caller.identityMatch = addr.identityMatch || "";
      await saveCaller(caller);
      render();

      const target = chosenAddress(caller);
      if (target && target.street_level) {
        setStatus(spin + "3/3 property — pulling records for " + esc(target.street) + "…");
        const p = await api("/api/enrich", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ address: target.full_address || target.street, processor: processor }),
        });
        const pr = await pollRun(p.propertyRunId, "property", (s) =>
          setStatus(spin + "3/3 property — pulling records (" + s + "s)…")
        );
        caller.property = pr.property;
        caller.propertyForRank = target.rank;
        setStatus("Done — " + esc(caller.person.name) + " enriched to street level.");
      } else {
        setStatus("Addresses found, but no street-level residential candidate to pull property records for.");
      }
      caller.pending = false;
      await saveCaller(caller);
      render();
      $("#caller-phone").value = "";
    } catch (e) {
      setStatus('<span style="color:var(--heat)">' + esc(e.message) + "</span>");
      const c = state.callers.find((x) => x.pending);
      if (c) { c.pending = false; saveCaller(c); render(); }
    } finally {
      btn.disabled = false;
    }
  }

  async function runPropertyFor(callerId, rank) {
    const find = () => state.callers.find((x) => x.id === callerId);
    let c = find();
    if (!c) return;
    const a = c.addresses.find((x) => x.rank === rank);
    if (!a) return;
    // Persist the pick before the run so a reload (or a teammate) sees which
    // address this card is about, even while the property lookup is in flight.
    c.chosenRank = rank;
    c.property = null;
    c.propertyForRank = null;
    c.pending = true;
    render();
    await saveCaller(c);
    try {
      setStatus(spin + "property — pulling records for " + esc(a.street) + "…");
      const p = await api("/api/enrich", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ address: a.full_address || a.street }),
      });
      const pr = await pollRun(p.propertyRunId, "property", (s) =>
        setStatus(spin + "property — pulling records (" + s + "s)…")
      );
      c = find() || c; // a background refresh may have swapped the object
      c.chosenRank = rank;
      c.property = pr.property;
      c.propertyForRank = rank;
      setStatus("Property records updated for " + esc(a.street) + ".");
    } catch (e) {
      setStatus('<span style="color:var(--heat)">' + esc(e.message) + "</span>");
      c = find() || c;
    } finally {
      c.pending = false;
      await saveCaller(c);
      render();
    }
  }

  /* ---------- caller roster rendering ---------- */
  // Treat "Not reported…"-style prose as an empty field so it never becomes a tile.
  const NOT_REPORTED = /^(not |no |unknown|n\/a|none\b|—|-)/i;
  function propVal(p, k) {
    const v = p && p[k] != null ? String(p[k]).trim() : "";
    return !v || NOT_REPORTED.test(v) ? "" : v;
  }

  // Fields that belong in a tile must be an actual measurement. The model
  // sometimes answers with a caveat sentence ("1,000,000 sq ft for the retail
  // center; Unit 207 interior area was not reported"), which is useful prose
  // but is not a number — keep it out of the tiles and the header spec line.
  const NUMERIC_FIELDS = new Set(["bedrooms", "bathrooms", "square_footage", "year_built", "stories", "lot_size"]);
  function propNum(p, k) {
    const v = propVal(p, k);
    if (!v) return "";
    if (!NUMERIC_FIELDS.has(k)) return v;
    const clean = v.replace(/ \(.*?\)/g, "").replace(/ ?(sqft|sq\.? ?ft|acres?)\.?$/i, "").trim();
    return /^[\d.,/]+$/.test(clean) && clean.length <= 12 ? clean : "";
  }

  function specLine(c) {
    const p = c.property;
    if (!p || !String(p.property_found).toLowerCase().startsWith("y")) return "";
    const bits = [
      [propNum(p, "bedrooms"), "bd"], [propNum(p, "bathrooms"), "ba"],
      [propNum(p, "square_footage"), "sqft"],
    ].filter(([v]) => v).map(([v, u]) => v + " " + u);
    const yr = propNum(p, "year_built");
    if (yr) bits.push("built " + yr);
    const type = propVal(p, "property_type");
    if (type) bits.push(type);
    return bits.length ? '<div class="cspec">' + esc(bits.join(" · ")) + "</div>" : "";
  }

  function propTiles(p) {
    const tiles = [
      ["bedrooms", "beds"], ["bathrooms", "baths"], ["square_footage", "sqft"],
      ["year_built", "built"], ["stories", "stories"], ["lot_size", "lot"],
    ].filter(([k]) => propNum(p, k));
    if (!tiles.length) return "";
    return '<div class="prop-grid">' + tiles.map(([k, label]) =>
      '<div class="prop-tile"><div class="pv">' + esc(propNum(p, k)) + "</div>" +
      '<div class="pl">' + label + "</div></div>"
    ).join("") + "</div>";
  }

  function propRows(p) {
    const rows = [
      ["property_type", "type"], ["estimated_value", "est. value"], ["assessed_value", "assessed"],
      ["annual_property_tax", "annual tax"], ["last_sold_date", "last sold"], ["last_sold_price", "sold price"],
      ["hvac_system", "HVAC"], ["hoa_fee", "HOA"], ["parcel_apn", "APN"],
      // measurements too wordy to be a tile still show here, with their caveat intact
      ["square_footage", "sqft note"], ["lot_size", "lot note"], ["bedrooms", "beds note"],
      ["bathrooms", "baths note"], ["sources", "sources"],
    ].filter(([k]) => propVal(p, k) && (!NUMERIC_FIELDS.has(k) || !propNum(p, k)));
    if (!rows.length) return "";
    return '<div class="prop-kv">' + rows.map(([k, label]) =>
      '<span class="k">' + label + '</span><span class="v">' + esc(propVal(p, k).slice(0, 260)) + "</span>"
    ).join("") + "</div>";
  }

  function callerCard(c) {
    const a = chosenAddress(c);
    const surge = surgeFor(a);
    const open = !!c.open;
    let flags = "";
    if (a) {
      flags += '<span class="atype ' + esc(a.address_type) + '">' + esc(a.address_type.replace(/_/g, " ")) + "</span>";
      if (a.confidence) flags += '<span class="conf ' + esc(a.confidence) + '">' + esc(a.confidence) + "</span>";
      if (!a.street_level) flags += '<span class="conf low">city only</span>';
    }
    if (surge && !surge.outside && (surge.alerts.length || surge.events.length)) {
      flags += '<span class="chip heat">surge · ' + esc(surge.metro.name.split(",")[0]) + "</span>";
    }

    let body = "";
    if (open) {
      body += '<div class="caller-body">';

      // property first — for a dispatcher this is the payload, so it leads;
      // the candidate-address research below is the audit trail behind it.
      if (c.property) {
        const p = c.property;
        const forA = c.addresses && c.addresses.find((x) => x.rank === c.propertyForRank);
        body += '<div class="sect">Property' + (forA ? " · " + esc(forA.street) : "") + "</div>";
        // Explain an empty spec sheet rather than leaving a blank gap: commercial
        // records carry no beds/baths, and apartment units often have no
        // unit-level record at all.
        const nonResi = forA && !/residential|household/.test(forA.address_type);
        if (nonResi) {
          body += '<div class="surge-flag quiet">Pulled from a ' +
            esc(forA.address_type.replace(/_/g, " ")) +
            " address — commercial records carry no bedroom/bathroom data. " +
            "Pick a residential candidate below for home specs.</div>";
        }
        if (String(p.property_found).toLowerCase().startsWith("y")) {
          const tiles = propTiles(p);
          body += tiles + propRows(p);
          if (!tiles && !nonResi) {
            body += '<div class="aev">Record found, but no unit-level bedroom/bathroom/size figures were ' +
              "published for this address.</div>";
          }
        } else {
          body += '<div class="aev">No public property record matched this address' +
            (forA && /unit|apt|#/i.test(forA.street) ? " — individual units in a multi-unit building often have no separate public record." : ".") +
            "</div>";
        }
      } else if (c.addresses && c.addresses.length) {
        body += '<div class="sect">Property</div><div class="aev">' + spin +
          " pulling records… (or pick a different address below)</div>";
      }

      // identity
      body += '<div class="sect">Identity</div><div class="prop-kv">' +
        '<span class="k">phone</span><span class="v mono">' + esc(c.phone) + "</span>" +
        (c.person.title ? '<span class="k">title</span><span class="v">' + esc(c.person.title) + "</span>" : "") +
        (c.person.employer ? '<span class="k">employer</span><span class="v">' + esc(c.person.employer) + "</span>" : "") +
        (c.person.recommendedEmail ? '<span class="k">email</span><span class="v">' + esc(c.person.recommendedEmail) + "</span>" : "") +
        (c.person.location ? '<span class="k">stated loc</span><span class="v">' + esc(c.person.location) + "</span>" : "") +
        (c.person.linkedin ? '<span class="k">linkedin</span><span class="v"><a href="' + esc(c.person.linkedin) + '" target="_blank" rel="noopener">profile</a></span>' : "") +
        "</div>";
      if (c.identityMatch) body += '<div class="aev" style="margin-top:6px;color:var(--ink-2);font-size:11.5px">' + esc(c.identityMatch) + "</div>";

      // addresses
      if (c.addresses === null) {
        body += '<div class="sect">Addresses</div><div class="aev">' + spin + " researching candidates…</div>";
      } else {
        const streetN = c.addresses.filter((x) => x.street_level).length;
        const showAll = state.openAddrs.has(c.id);
        const shownAddrs = showAll ? c.addresses : c.addresses.filter((x) => a && x.rank === a.rank);
        body += '<div class="sect">Candidate addresses · ' + c.addresses.length + " (" + streetN + " street-level)" +
          (c.addresses.length > 1
            ? ' <button class="linkbtn" data-act="addrs" data-caller="' + esc(c.id) + '">' +
              (showAll ? "show less" : "show all " + c.addresses.length) + "</button>"
            : "") + "</div>";
        body += shownAddrs.map((x) =>
          '<div class="addr-row' + (a && x.rank === a.rank ? " chosen" : "") + '" data-caller="' + esc(c.id) + '" data-rank="' + x.rank + '">' +
            '<div class="a1">' +
              '<span class="rank">#' + x.rank + "</span>" +
              '<span class="astreet">' + esc(x.street || "(no street)") + "</span>" +
              '<span class="acity">' + esc([x.city, x.state, x.postal_code].filter(Boolean).join(", ")) + "</span>" +
              '<span class="atype ' + esc(x.address_type) + '">' + esc(x.address_type.replace(/_/g, " ")) + "</span>" +
              (x.confidence ? '<span class="conf ' + esc(x.confidence) + '">' + esc(x.confidence) + "</span>" : "") +
            "</div>" +
            (x.evidence ? '<div class="aev">' + esc(x.evidence.slice(0, 220)) + "</div>" : "") +
            '<div class="asrc">' + esc(x.source_name || "") + (x.as_of ? " · as of " + esc(x.as_of) : "") +
              (x.source_url ? ' · <a href="' + esc(x.source_url) + '" target="_blank" rel="noopener">source</a>' : "") + "</div>" +
          "</div>"
        ).join("");
      }

      // surge
      if (surge && !surge.outside) {
        body += '<div class="sect">Surge exposure</div>';
        body += (surge.alerts.length || surge.events.length)
          ? '<div class="surge-flag"><b>' + esc(surge.metro.name.split(",")[0]) + " (" + surge.km + " km)</b> — " +
            (surge.alerts.length ? surge.alerts.length + " active NWS alert" + (surge.alerts.length === 1 ? "" : "s") + " (" + esc(surge.alerts.map((x) => x.event).slice(0, 2).join(", ")) + ")" : "") +
            (surge.events.length ? (surge.alerts.length ? " · " : "") + surge.events.length + " monitor event" + (surge.events.length === 1 ? "" : "s") : "") +
            (surge.brief ? " · surge brief ready" : "") + ". Route as priority.</div>"
          : '<div class="surge-flag quiet">' + esc(surge.metro.name.split(",")[0]) + " — no active events. Standard intake.</div>";
      } else if (surge && surge.outside) {
        body += '<div class="sect">Surge exposure</div><div class="surge-flag quiet">Outside the monitored metros.</div>';
      }

      body += '<div class="caller-actions">' +
        (a && surge && !surge.outside ? '<button data-act="metro" data-caller="' + esc(c.id) + '">Open metro</button>' : "") +
        '<button data-act="remove" data-caller="' + esc(c.id) + '">Remove</button>' +
        "</div>";
      body += "</div>";
    }

    return (
      '<article class="caller' + (state.selCaller === c.id ? " sel" : "") + '" id="caller-' + esc(c.id) + '">' +
        '<button class="caller-head" data-caller="' + esc(c.id) + '">' +
          '<span class="cwhen">' + esc(timeAgo(c.enrichedAt)) + "</span>" +
          '<div class="cn">' + esc(c.person.name) + "</div>" +
          '<div class="cmeta">' + esc(c.phone) + (c.person.employer ? " · " + esc(c.person.employer) : "") + "</div>" +
          (a ? '<div class="caddr">' + esc(a.street || a.city || "") +
                (a.city ? ", " + esc(a.city) + " " + esc(a.state || "") + " " + esc(a.postal_code || "") : "") + "</div>"
             : '<div class="caddr">' + spin + " researching…</div>") +
          specLine(c) +
          '<div class="cflags">' + flags + "</div>" +
        "</button>" + body +
      "</article>"
    );
  }

  /* ---------- call log: search, sort, export ---------- */
  function callerSearchBlob(c) {
    const a = chosenAddress(c);
    return [
      c.person.name, c.phone, c.person.employer, c.person.title, c.person.recommendedEmail,
      a && a.street, a && a.city, a && a.state, a && a.postal_code,
      ...(c.addresses || []).map((x) => x.street + " " + x.city),
    ].filter(Boolean).join(" ").toLowerCase();
  }

  function visibleCallers() {
    const q = (state.callerQuery || "").trim().toLowerCase();
    let list = state.callers.filter((c) => !q || callerSearchBlob(c).includes(q));
    const surgeScore = (c) => {
      const s = surgeFor(chosenAddress(c));
      return s && !s.outside ? s.alerts.length * 2 + s.events.length : 0;
    };
    const byTime = (a, b) => new Date(b.enrichedAt) - new Date(a.enrichedAt);
    if (state.callerSort === "oldest") list = [...list].sort((a, b) => -byTime(a, b));
    else if (state.callerSort === "name")
      list = [...list].sort((a, b) => (a.person.name || "").localeCompare(b.person.name || ""));
    else if (state.callerSort === "surge")
      list = [...list].sort((a, b) => surgeScore(b) - surgeScore(a) || byTime(a, b));
    else list = [...list].sort(byTime);
    return list;
  }

  // Columns mirror the enrichment pipeline's CSV output so exports drop
  // straight into the same downstream tooling.
  const CSV_COLUMNS = [
    "phone", "person_name", "employer", "title", "recommended_email", "linkedin",
    "identity_match", "address_rank", "address", "street", "city", "state", "postal_code",
    "country", "address_type", "address_confidence", "address_as_of", "address_source",
    "address_evidence", "property_found", "property_type", "bedrooms", "bathrooms",
    "square_footage", "lot_size", "year_built", "stories", "last_sold_date", "last_sold_price",
    "estimated_value", "assessed_value", "annual_property_tax", "parcel_apn", "hoa_fee",
    "hvac_system", "property_sources", "surge_metro", "surge_active_alerts", "looked_up_at",
  ];

  function exportCsv() {
    const rows = [CSV_COLUMNS];
    for (const c of visibleCallers()) {
      const s = surgeFor(chosenAddress(c));
      const p = c.property || {};
      const addrs = c.addresses && c.addresses.length ? c.addresses : [null];
      for (const a of addrs) {
        const isPropRow = a && c.propertyForRank === a.rank;
        rows.push([
          c.phone, c.person.name, c.person.employer, c.person.title,
          c.person.recommendedEmail, c.person.linkedin, c.identityMatch,
          a ? a.rank : "", a ? a.full_address : "", a ? a.street : "", a ? a.city : "",
          a ? a.state : "", a ? a.postal_code : "", a ? a.country : "",
          a ? a.address_type : "", a ? a.confidence : "", a ? a.as_of : "",
          a ? a.source_name : "", a ? a.evidence : "",
          isPropRow ? p.property_found : "", isPropRow ? p.property_type : "",
          isPropRow ? p.bedrooms : "", isPropRow ? p.bathrooms : "",
          isPropRow ? p.square_footage : "", isPropRow ? p.lot_size : "",
          isPropRow ? p.year_built : "", isPropRow ? p.stories : "",
          isPropRow ? p.last_sold_date : "", isPropRow ? p.last_sold_price : "",
          isPropRow ? p.estimated_value : "", isPropRow ? p.assessed_value : "",
          isPropRow ? p.annual_property_tax : "", isPropRow ? p.parcel_apn : "",
          isPropRow ? p.hoa_fee : "", isPropRow ? p.hvac_system : "", isPropRow ? p.sources : "",
          s && !s.outside ? s.metro.name : "", s && !s.outside ? s.alerts.length : "",
          c.enrichedAt,
        ].map((v) => {
          const t = v === null || v === undefined ? "" : String(v);
          return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
        }));
      }
    }
    const blob = new Blob([rows.map((r) => r.join(",")).join("\n")], { type: "text/csv" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "avoca-caller-log.csv";
    a.click();
    URL.revokeObjectURL(url);
  }

  function renderCallers() {
    const n = state.callers.length;
    $("#tab-count").textContent = n ? "· " + n : "";
    const hist = $("#caller-history");
    if (hist) hist.hidden = n === 0;
    const list = $("#callerlist");
    if (!list) return;
    const shown = visibleCallers();
    const countEl = $("#hist-count");
    if (countEl) {
      const street = state.callers.filter((c) => { const a = chosenAddress(c); return a && a.street_level; }).length;
      countEl.textContent =
        (shown.length === n ? n + " lookup" + (n === 1 ? "" : "s") : shown.length + " of " + n) +
        " · " + street + " street-level";
    }
    list.innerHTML = n
      ? (shown.length
          ? shown.map(callerCard).join("")
          : '<div class="empty">No lookups match that search.</div>')
      : '<div class="empty">No callers yet. Enter a phone number above — the pipeline resolves identity, ' +
        "researches street-level address candidates, then pulls property records.<br><br>" +
        "Every lookup is kept here as a searchable call log.</div>";

    list.querySelectorAll(".caller-head").forEach((el) => {
      el.addEventListener("click", () => {
        const c = state.callers.find((x) => x.id === el.dataset.caller);
        if (!c) return;
        c.open = !c.open;
        if (c.open) state.openCards.add(c.id); else state.openCards.delete(c.id);
        state.selCaller = c.open ? c.id : null;
        render();
      });
    });
    list.querySelectorAll(".addr-row").forEach((el) => {
      el.addEventListener("click", () => runPropertyFor(el.dataset.caller, Number(el.dataset.rank)));
    });
    list.querySelectorAll("[data-act]").forEach((el) => {
      el.addEventListener("click", (ev) => {
        ev.stopPropagation();
        const c = state.callers.find((x) => x.id === el.dataset.caller);
        if (!c) return;
        if (el.dataset.act === "remove") {
          if (!confirm("Remove " + c.person.name + " from the shared call log?")) return;
          state.callers = state.callers.filter((x) => x.id !== c.id);
          render();
          api("/api/callers?id=" + encodeURIComponent(c.id), { method: "DELETE" })
            .catch((e) => setStatus('<span style="color:var(--heat)">delete failed — ' + esc(e.message) + "</span>"));
        } else if (el.dataset.act === "addrs") {
          if (state.openAddrs.has(c.id)) state.openAddrs.delete(c.id);
          else state.openAddrs.add(c.id);
          render();
        } else if (el.dataset.act === "metro") {
          const s = surgeFor(chosenAddress(c));
          if (s && s.metro) { state.metro = s.metro.id; state.tab = "monitors"; render(); }
        }
      });
    });
  }

  function setTab(tab) {
    state.tab = tab;
    document.querySelectorAll(".railtab").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
    $("#pane-monitors").hidden = tab !== "monitors";
    $("#pane-callers").hidden = tab !== "callers";
  }

  function render() {
    renderScorecards();
    renderChips();
    renderMap();
    renderDetail();
    renderFeed();
    renderCallers();
    renderCallerPins();
  }

  function boot() {
    $("#h-metros").textContent = DATA.metros.length;
    $("#h-sub-metros").textContent = DATA.metros.length;
    $("#h-monitors").textContent = DATA.fleet.narrow + DATA.fleet.wide;
    $("#h-updated").textContent =
      timeAgo(DATA.generatedAt) || new Date(DATA.generatedAt).toLocaleString();
    render();
  }

  state.callers = [];
  state.openCards = new Set();
  state.openAddrs = new Set();
  state.selCaller = null;
  state.tab = "monitors";
  state.callerQuery = "";
  state.callerSort = "recent";

  if (DATA) {
    boot();
  } else {
    // Live deployment: the Callers tab needs /api/enrich, so it only exists here.
    document.querySelector('.railtab[data-tab="callers"]').hidden = false;
    document.querySelectorAll(".railtab").forEach((b) => {
      b.addEventListener("click", () => { setTab(b.dataset.tab); render(); });
    });
    $("#caller-run").addEventListener("click", runLookup);
    $("#caller-phone").addEventListener("keydown", (e) => { if (e.key === "Enter") runLookup(); });
    $("#caller-q").addEventListener("input", (e) => { state.callerQuery = e.target.value; renderCallers(); });
    $("#caller-sort").addEventListener("change", (e) => { state.callerSort = e.target.value; render(); });
    $("#caller-export").addEventListener("click", exportCsv);
    $("#caller-clear").addEventListener("click", async () => {
      if (!confirm("Clear the entire shared call log for everyone? This cannot be undone.")) return;
      state.callers = [];
      state.selCaller = null;
      render();
      try {
        await api("/api/callers?all=1", { method: "DELETE" });
        setStatus("Call log cleared.");
      } catch (e) {
        setStatus('<span style="color:var(--heat)">clear failed — ' + esc(e.message) + "</span>");
        refreshCallers(true);
      }
    });
    $("#caller-refresh").addEventListener("click", () => refreshCallers(false));
    // Data comes from the serverless API at request time.
    $("#feedhead").textContent = "loading live monitor data…";
    fetch("/api/data")
      .then((r) => { if (!r.ok) throw new Error("api/data " + r.status); return r.json(); })
      .then((d) => {
        DATA = d;
        boot();
        // Shared call log: load once, then poll so lookups run by teammates
        // (or in another tab) show up without a manual refresh.
        refreshCallers(true);
        setInterval(() => {
          if (!state.callers.some((c) => c.pending)) refreshCallers(true);
        }, 30000);
      })
      .catch((e) => { $("#feedhead").textContent = "failed to load live data — " + e.message; });
  }
</script>
