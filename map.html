<title>Avoca Weather Demand Watch</title>
<style>
  :root {
    --bg: #EEF1F4;
    --panel: #FFFFFF;
    --panel-2: #E4E9EE;
    --land: #FBFCFD;
    --border-state: #D3DAE2;
    --border-nation: #B7C1CC;
    --ink: #1C2530;
    --ink-2: #4A5766;
    --ink-3: #8391A0;
    --line: #D8DEE5;
    --accent: #B96E12;
    --accent-bg: #F5EBDB;
    --good: #1E7A46;
    --heat: #C14E13;
    --storm: #6D55B8;
    --flood: #0E7490;
    --freeze: #3D6FA8;
    --outage: #8A6A00;
    --quiet: #93A0AE;
    --chip-heat-bg: #F6E5DC; --chip-storm-bg: #EAE5F5;
    --chip-flood-bg: #DDEEF3; --chip-freeze-bg: #E1EAF4;
    --chip-outage-bg: #F1EAD2; --chip-quiet-bg: #E7EBEF;
    --narrow: #3D6FA8; --wide: #B96E12;
    --shadow: 0 8px 28px rgba(20, 30, 42, 0.14);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0F141B; --panel: #161D26; --panel-2: #1F2833;
      --land: #1A222C; --border-state: #2A3441; --border-nation: #3A4655;
      --ink: #E6EBF1; --ink-2: #AAB6C3; --ink-3: #75828F; --line: #2C3642;
      --accent: #E29A3C; --accent-bg: #322817; --good: #4FB477;
      --heat: #F07B4A; --storm: #A78BE8; --flood: #4FB3D1; --freeze: #7FA9DE;
      --outage: #D9B23F; --quiet: #5A6878;
      --chip-heat-bg: #3A2620; --chip-storm-bg: #2C2740;
      --chip-flood-bg: #1B3340; --chip-freeze-bg: #223349;
      --chip-outage-bg: #332C15; --chip-quiet-bg: #232C36;
      --narrow: #7FA9DE; --wide: #E29A3C;
      --shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F141B; --panel: #161D26; --panel-2: #1F2833;
    --land: #1A222C; --border-state: #2A3441; --border-nation: #3A4655;
    --ink: #E6EBF1; --ink-2: #AAB6C3; --ink-3: #75828F; --line: #2C3642;
    --accent: #E29A3C; --accent-bg: #322817; --good: #4FB477;
    --heat: #F07B4A; --storm: #A78BE8; --flood: #4FB3D1; --freeze: #7FA9DE;
    --outage: #D9B23F; --quiet: #5A6878;
    --chip-heat-bg: #3A2620; --chip-storm-bg: #2C2740;
    --chip-flood-bg: #1B3340; --chip-freeze-bg: #223349;
    --chip-outage-bg: #332C15; --chip-quiet-bg: #232C36;
    --narrow: #7FA9DE; --wide: #E29A3C;
    --shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
  }
  :root[data-theme="light"] {
    --bg: #EEF1F4; --panel: #FFFFFF; --panel-2: #E4E9EE;
    --land: #FBFCFD; --border-state: #D3DAE2; --border-nation: #B7C1CC;
    --ink: #1C2530; --ink-2: #4A5766; --ink-3: #8391A0; --line: #D8DEE5;
    --accent: #B96E12; --accent-bg: #F5EBDB; --good: #1E7A46;
    --heat: #C14E13; --storm: #6D55B8; --flood: #0E7490; --freeze: #3D6FA8;
    --outage: #8A6A00; --quiet: #93A0AE;
    --chip-heat-bg: #F6E5DC; --chip-storm-bg: #EAE5F5;
    --chip-flood-bg: #DDEEF3; --chip-freeze-bg: #E1EAF4;
    --chip-outage-bg: #F1EAD2; --chip-quiet-bg: #E7EBEF;
    --narrow: #3D6FA8; --wide: #B96E12;
    --shadow: 0 8px 28px rgba(20, 30, 42, 0.14);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Avenir Next", "Seravek", "Segoe UI", system-ui, sans-serif;
    font-size: 14px; line-height: 1.5;
  }
  .display { font-family: "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }

  #app { display: flex; flex-direction: column; height: 100vh; }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    padding: 12px 20px; background: var(--panel);
    border-bottom: 1px solid var(--line); z-index: 5;
  }
  .brand { display: flex; flex-direction: column; }
  .brand .t {
    font-family: "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif;
    font-size: 19px; font-weight: 700; letter-spacing: 0.01em; line-height: 1.15;
  }
  .brand .s {
    font-size: 11px; color: var(--ink-3); letter-spacing: 0.1em; text-transform: uppercase;
    font-family: "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif; font-weight: 600;
  }
  .hstat { display: flex; gap: 16px; align-items: center; font-size: 12.5px; color: var(--ink-2); flex-wrap: wrap; }
  .hstat b { color: var(--ink); font-weight: 600; }
  .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--good); margin-right: 6px; }
  @media (prefers-reduced-motion: no-preference) {
    .live-dot { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.35; } }
  }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin-left: auto; }
  .seg button {
    border: none; background: var(--panel); color: var(--ink-2); cursor: pointer;
    padding: 6px 14px; font: inherit; font-size: 12.5px; font-weight: 600;
  }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--ink); color: var(--panel); }
  .seg button:focus-visible, .chipbtn:focus-visible, .marker:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* ---------- layout ---------- */
  #body { display: flex; flex: 1; min-height: 0; }
  #mapwrap { flex: 1; position: relative; min-width: 0; display: flex; align-items: center; justify-content: center; padding: 10px; }
  #mapwrap svg { width: 100%; height: 100%; max-height: calc(100vh - 120px); }

  #rail {
    width: 400px; max-width: 46vw; border-left: 1px solid var(--line);
    background: var(--panel); display: flex; flex-direction: column; min-height: 0;
  }
  @media (max-width: 860px) {
    #body { flex-direction: column; }
    #mapwrap { min-height: 46vh; }
    #mapwrap svg { max-height: 44vh; }
    #rail { width: 100%; max-width: none; border-left: none; border-top: 1px solid var(--line); flex: 1; }
  }

  /* ---------- map ---------- */
  .nation { fill: var(--land); stroke: var(--border-nation); stroke-width: 1; }
  .mesh { fill: none; stroke: var(--border-state); stroke-width: 0.7; }
  .marker { cursor: pointer; }
  .marker circle.core { stroke: var(--panel); stroke-width: 1.6; }
  .marker.dim { opacity: 0.38; }
  .marker text {
    font-family: "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif;
    font-size: 11.5px; font-weight: 600; letter-spacing: 0.04em;
    fill: var(--ink-2); text-anchor: middle; pointer-events: none;
    paint-order: stroke; stroke: var(--land); stroke-width: 3px; stroke-linejoin: round;
  }
  .marker.sel text { fill: var(--ink); }
  .ring { fill: none; stroke-width: 1.6; opacity: 0.85; }
  @media (prefers-reduced-motion: no-preference) {
    .ring { animation: ringpulse 2.2s ease-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes ringpulse { 0% { opacity: 0.9; } 70% { opacity: 0.25; } 100% { opacity: 0.9; } }
  }
  .selhalo { fill: none; stroke: var(--ink); stroke-width: 1.2; stroke-dasharray: 3 3; }

  #tooltip {
    position: absolute; pointer-events: none; display: none; z-index: 10;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    box-shadow: var(--shadow); padding: 8px 12px; max-width: 280px; font-size: 12.5px;
  }
  #tooltip .tt-name { font-weight: 600; }
  #tooltip .tt-sub { color: var(--ink-2); }

  #legend {
    position: absolute; left: 18px; bottom: 14px; z-index: 4;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 12px; font-size: 11.5px; color: var(--ink-2);
    display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
  }
  #legend .li { display: flex; align-items: center; gap: 5px; }
  #legend .sw { width: 9px; height: 9px; border-radius: 50%; }

  /* ---------- rail ---------- */
  #scorecards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px 14px 4px; }
  .scard {
    border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px;
    background: var(--panel); cursor: pointer; text-align: left; font: inherit; color: inherit;
  }
  .scard.on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .scard .cfg {
    font-family: "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif;
    font-size: 11.5px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
  }
  .scard.narrow .cfg { color: var(--narrow); }
  .scard.wide .cfg { color: var(--wide); }
  .scard .rc { font-size: 21px; font-weight: 600; margin-top: 2px; }
  .scard .rc span { color: var(--ink-3); font-size: 14px; }
  .scard .sub { font-size: 11px; color: var(--ink-3); line-height: 1.35; margin-top: 2px; }

  #typechips { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 14px 12px; border-bottom: 1px solid var(--line); }
  .chipbtn {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink-2);
    border-radius: 99px; padding: 3px 11px; font: inherit; font-size: 11.5px; font-weight: 600;
    cursor: pointer; letter-spacing: 0.04em; text-transform: uppercase;
    font-family: "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif;
  }
  .chipbtn .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
  .chipbtn.on { color: var(--ink); border-color: var(--ink-2); background: var(--panel-2); }

  #railscroll { overflow-y: auto; flex: 1; min-height: 0; }

  #detail { border-bottom: 1px solid var(--line); padding: 14px; background: var(--panel-2); }
  #detail .dh { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  #detail h2 {
    margin: 0; font-size: 18px; font-weight: 700;
    font-family: "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif;
  }
  #detail .close {
    border: none; background: none; color: var(--ink-3); cursor: pointer;
    font-size: 16px; padding: 2px 6px; line-height: 1;
  }
  #detail .counties { font-size: 11.5px; color: var(--ink-3); margin: 2px 0 0; }
  #detail .why { font-size: 12.5px; color: var(--ink-2); margin: 8px 0 0; }
  #detail .cov { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .covpill {
    font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    font-family: "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif;
    padding: 2px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--ink-3);
  }
  .covpill.has { color: var(--ink); border-color: var(--ink-3); }
  #detail .alerts { margin-top: 12px; }
  #detail .alerts h3 {
    margin: 0 0 6px; font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-3); font-family: "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif; font-weight: 600;
  }
  .alertrow { display: flex; gap: 8px; align-items: baseline; padding: 5px 0; border-top: 1px solid var(--line); font-size: 12.5px; }
  .alertrow .an { font-weight: 600; }
  .alertrow .at { color: var(--ink-3); margin-left: auto; white-space: nowrap; }
  .badge-active {
    font-size: 10px; font-weight: 700; letter-spacing: 0.08em; color: var(--good);
    border: 1px solid var(--good); border-radius: 99px; padding: 0 7px; text-transform: uppercase;
  }
  .badge-exp { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: var(--ink-3); border: 1px solid var(--line); border-radius: 99px; padding: 0 7px; text-transform: uppercase; }

  /* surge brief */
  .brief {
    margin-top: 14px; border: 1px solid var(--accent); border-radius: 6px;
    background: var(--panel); overflow: hidden;
  }
  .brief .bh {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    background: var(--accent-bg); color: var(--accent);
    font-family: "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif;
    font-size: 11.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
  }
  .brief .bb { padding: 10px 12px 12px; font-size: 12.5px; }
  .brief h4 { margin: 0 0 6px; font-size: 14px; font-weight: 600; line-height: 1.35; }
  .brief .brow { margin-top: 8px; }
  .brief .brow .bl {
    font-family: "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif;
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-3); display: block;
  }
  .brief .brow .bv { color: var(--ink-2); line-height: 1.5; }
  .brief .outbound {
    margin-top: 10px; padding: 8px 11px; border-left: 3px solid var(--accent);
    background: var(--accent-bg); border-radius: 0 4px 4px 0; font-style: italic; color: var(--ink);
  }

  /* buyer map */
  .buyers { margin-top: 14px; }
  .buyers .snapshot { font-size: 12.5px; color: var(--ink-2); margin: 6px 0 8px; line-height: 1.5; }
  .buyerrow { border-top: 1px solid var(--line); padding: 8px 0; font-size: 12.5px; }
  .buyerrow .b1 { display: flex; gap: 7px; align-items: baseline; flex-wrap: wrap; }
  .buyerrow .bn { font-weight: 600; }
  .buyerrow .bp { color: var(--ink-3); font-size: 11.5px; }
  .buyerrow .bnote { color: var(--ink-2); margin-top: 2px; line-height: 1.45; }
  .btype {
    font-size: 10px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase;
    border-radius: 99px; padding: 0 7px;
    font-family: "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif;
  }
  .btype.pe { color: var(--wide); background: var(--accent-bg); }
  .btype.fr { color: var(--storm); background: var(--chip-storm-bg); }
  .btype.ind { color: var(--ink-2); background: var(--chip-quiet-bg); }
  .rollup-note { font-size: 12px; color: var(--ink-2); margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); line-height: 1.5; }

  /* rail tabs */
  #railtabs { display: flex; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
  .railtab {
    flex: 1; border: none; background: none; color: var(--ink-3); cursor: pointer;
    padding: 11px 8px; font: inherit; font-size: 12.5px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    font-family: "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif;
    border-bottom: 2px solid transparent;
  }
  .railtab.on { color: var(--ink); border-bottom-color: var(--accent); }
  .railtab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  #tab-count { color: var(--ink-3); font-weight: 500; }
  #pane-monitors, #pane-callers { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  #pane-monitors[hidden], #pane-callers[hidden] { display: none; }
  #callerscroll { overflow-y: auto; flex: 1; min-height: 0; }
  #caller-search { padding: 12px 14px; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
  #caller-status { font-size: 12px; color: var(--ink-2); margin-top: 8px; min-height: 0; }
  #caller-status .spin { margin-right: 6px; vertical-align: -1px; }
  #caller-history { padding: 10px 14px; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
  .hist-bar { display: flex; gap: 8px; }
  .hist-bar input {
    flex: 1; font: inherit; font-size: 12.5px; padding: 6px 10px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink);
  }
  .hist-bar select {
    font: inherit; font-size: 12px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--ink-2); padding: 0 6px;
  }
  .hist-meta {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-top: 8px; font-size: 11.5px; color: var(--ink-3);
  }
  .hist-actions { display: flex; gap: 6px; }
  .hist-actions button {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink-2);
    border-radius: 5px; padding: 3px 9px; font: inherit; font-size: 11px; font-weight: 600; cursor: pointer;
  }
  .hist-actions button:hover { color: var(--ink); }
  .caller-head .cwhen { float: right; font-size: 11px; color: var(--ink-3); font-weight: 500; }

  /* caller lookup */
  .phone-row { display: flex; gap: 8px; }
  .phone-row input {
    flex: 1; font: inherit; font-family: ui-monospace, "SF Mono", Menlo, monospace;
    padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--ink);
  }
  .phone-row select {
    font: inherit; font-size: 12.5px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--ink-2); padding: 0 8px;
  }
  .phone-row button {
    border: none; background: var(--accent); color: #fff; border-radius: 6px;
    padding: 8px 18px; font: inherit; font-weight: 600; cursor: pointer;
  }
  .phone-row button:disabled { opacity: 0.5; cursor: default; }
  .stage { margin-top: 14px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; }
  .stage .sh {
    font-family: "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif;
    font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink-3); margin-bottom: 6px; display: flex; align-items: center; gap: 8px;
  }
  .stage.pending { opacity: 0.55; }
  .spin {
    display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    border: 2px solid var(--accent); border-top-color: transparent;
  }
  @media (prefers-reduced-motion: no-preference) {
    .spin { animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  }
  .kv { display: grid; grid-template-columns: 118px 1fr; gap: 3px 12px; font-size: 12.5px; }
  .kv .k { color: var(--ink-3); }
  .kv .v { color: var(--ink); overflow-wrap: anywhere; }
  .conf { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; border-radius: 99px; padding: 0 6px; margin-left: 6px; }
  .conf.high { color: var(--good); border: 1px solid var(--good); }
  .conf.medium { color: var(--accent); border: 1px solid var(--accent); }
  .conf.low { color: var(--ink-3); border: 1px solid var(--line); }
  .evidence { margin-top: 8px; font-size: 12px; color: var(--ink-2); line-height: 1.5; border-top: 1px solid var(--line); padding-top: 8px; }
  .stage .cites { margin-top: 6px; font-size: 11.5px; color: var(--ink-3); }
  .stage .cites a { color: var(--ink-3); }
  .surge-flag {
    margin-top: 10px; padding: 9px 12px; border-left: 3px solid var(--heat);
    background: var(--chip-heat-bg); border-radius: 0 4px 4px 0; font-size: 12.5px; color: var(--ink);
  }
  .surge-flag.quiet { border-left-color: var(--quiet); background: var(--chip-quiet-bg); color: var(--ink-2); }
  .stage .mapbtn {
    margin-top: 8px; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink);
    border-radius: 6px; padding: 5px 12px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
  }

  /* caller cards */
  #callerlist { padding: 12px 14px 28px; display: grid; gap: 12px; }
  .caller {
    border: 1px solid var(--line); border-radius: 6px; background: var(--panel); overflow: hidden;
  }
  .caller.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .caller-head {
    width: 100%; text-align: left; border: none; background: none; color: inherit;
    font: inherit; cursor: pointer; padding: 12px 14px; display: block;
  }
  .caller-head .cn { font-size: 15px; font-weight: 600; line-height: 1.3; }
  .caller-head .cmeta { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
  .caller-head .caddr {
    font-size: 12.5px; margin-top: 6px; color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .caller-head .cspec {
    font-size: 12px; color: var(--accent); margin-top: 4px; font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .caller-head .cflags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; align-items: center; }
  .linkbtn {
    border: none; background: none; color: var(--accent); cursor: pointer;
    font: inherit; font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; padding: 0 0 0 4px; text-decoration: underline;
    font-family: "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif;
  }
  .caller-body { border-top: 1px solid var(--line); padding: 12px 14px; }
  .sect {

ine":"Dense Fog Advisory issued August 7 at 7:52AM CDT until August 7 at 9:00AM CDT by NWS Chicago IL","areaDesc":"Grundy; Kankakee; Livingston; Iroquois; Ford; Southern Cook; Northern Will; Southern Will; Eastern Will; Lake; Porter; Newton; Jasper; Benton","active":true}],"market":{"dfw":{"market_snapshot":"DFW is a large, still-expanding demand pool: FRED shows 8.477 million residents in 2025 versus 8.354 million in 2024 (about 1.48% growth), while NCTCOG's 2025 summary reports almost 76,000 additions in Collin County, more than 45,000 in Dallas County, and 35,746 in Tarrant County; the public excerpt did not expose Denton's number. The trade base is consolidating but remains multi-owner: SEER described Swan as its 42nd acquisition, and PitchBook data cited in 2024 reported that private-equity investors had purchased nearly 800 HVAC, plumbing, and electrical companies nationally since 2022. For an AI-CSR vendor, the practical demand drivers are population growth plus recurring cooling/heating, plumbing, and electrical repair and maintenance calls; that is an operating inference, not a published four-county market-size estimate.","buyers":[{"trades":"HVAC, plumbing, electrical","parent":"Wrench Group (Leonard Green & Partners—latest disclosed statement says majority owner; TSG Consumer Partners and Oak Hill also partnered in the 2022 transaction)","type":"pe_rollup_brand","company":"Baker Brothers Plumbing, Air & Electric","note":"Wrench's established DFW flagship; acquired in February 2017, when the release cited more than 100 trucks and 200 employees."},{"trades":"HVAC, plumbing, electrical","parent":"The SEER Group (Genstar Capital; Ares Management listed as a current investor in the 2026 profile evidence)","type":"pe_rollup_brand","company":"Swan Electric, Plumbing, Heating & Air","note":"SEER's 42nd acquisition and April 2025 Texas entry; Swan serves multiple east-Dallas/DFW communities across the three trades."},{"trades":"HVAC, plumbing","parent":"American Residential Services / ARS (GI Partners majority owner as of March 2026)","type":"pe_rollup_brand","company":"ARS/Rescue Rooter DFW","note":"A national residential-services platform with a dedicated greater-DFW/Arlington operation, making it a natural centralized call-center/CSR target."},{"trades":"HVAC, plumbing, electrical","parent":"Neighborly (franchisor; local franchisee ownership varies; no current sponsor was stated in the cited 2025-2026 evidence)","type":"franchise","company":"Neighborly DFW franchise network: Aire Serv Dallas, Mr. Rooter Plumbing of Dallas, and Mr. Electric of Fort Worth","note":"Three locally marketed Neighborly brands cover the core trades; Neighborly reported more than $4 billion of systemwide sales in 2023."},{"trades":"HVAC, plumbing, electrical","parent":"independent (family-owned; no current PE sponsor disclosed in the cited source)","type":"large_independent","company":"ABC Home & Commercial Services (DFW)","note":"Family-owned since 1949 with Dallas and Fort Worth operations and a broad home-service stack; its Texas profile lists AC/heating, plumbing, and electrical."},{"trades":"Electrical, HVAC, plumbing","parent":"independent (locally owned and family operated)","type":"large_independent","company":"Milestone Electric, A/C, & Plumbing","note":"DFW-focused all-trade operator with Dallas, Plano, Garland, and Fort Worth touchpoints; it describes itself as locally owned/family operated and voted #1 in DFW."}],"rollup_activity":"Consolidation is active: The SEER Group announced its 42nd acquisition, Swan, on April 23, 2025, and Paschal announced its acquisition and rebranding of JAK Services on July 22, 2025, explicitly expanding into DFW. The recent local tape also includes Chill Brothers' acquisition of Southlake-based Lee Air Services on October 10, 2023, and Air Pros USA's acquisition of Dallas Plumbing on June 23, 2022; a 2025 case summary says Air Pros entered Chapter 11, so Dallas Plumbing's post-2022 operating control should be re-verified before treating it as a current buyer."},"houston":{"market_snapshot":"The four-county Houston core sits inside a large, expanding housing market: Census reporting says Houston added approximately 43,000 residents from 2023 to 2024, while the broader Houston-The Woodlands-Sugar Land MSA permit series recorded 5,118 units in May 2026 and 4,773 in June 2026. The field is meaningfully but not fully consolidated—PE-backed platforms such as Wrench, Apex, HomeTown, Southern Home Services and GI Partners-backed ARS compete with long-established independents and local franchise brands such as One Hour/Authority Brands and Mr. Rooter/Neighborly; demand is supported by Houston's humid cooling load, ongoing new/aging-home maintenance, and hurricane/storm-surge/flood exposure.","buyers":[{"trades":"HVAC, plumbing, electrical","parent":"Apex Service Partners (Alpine Investors; Apollo Funds strategic investment announced May 2026)","type":"pe_rollup_brand","company":"Air Tech of Houston","note":"Established Houston multitrade operator; Apex acquired it on 7-Feb-2020 and the brand advertises 24/7 service."},{"trades":"HVAC, plumbing, electrical","parent":"Wrench Group (Leonard Green & Partners, TSG Consumer Partners, Oak Hill Capital)","type":"pe_rollup_brand","company":"Abacus Plumbing, Air Conditioning & Electrical","note":"Wrench’s Houston operating brand; its official local page lists plumbing, air conditioning/heating, indoor air quality and electrical services."},{"trades":"HVAC, plumbing, electrical","parent":"HomeTown Services (private-equity-backed; current sponsor not clearly disclosed in the reviewed public sources)","type":"pe_rollup_brand","company":"John Moore Services","note":"Large, highly visible Houston multitrade brand founded in 1965; HomeTown acquired it in September 2021."},{"trades":"HVAC, plumbing","parent":"Southern Home Services (Gryphon Investors)","type":"pe_rollup_brand","company":"Nick's Plumbing & Air Conditioning","note":"Important new platform entry: Southern acquired the Houston operator in October 2025; Nick’s has served Houston since 1979."},{"trades":"HVAC, plumbing, electrical","parent":"American Residential Services / ARS-Rescue Rooter (GI Partners majority owner; Charlesbank Capital Partners existing investor)","type":"pe_rollup_brand","company":"ARS/Rescue Rooter Houston","note":"National-scale platform with active Houston and Houston-South operations; the local branch is available seven days a week and the network covers all three target trades."},{"trades":"HVAC, plumbing, electrical","parent":"independent","type":"large_independent","company":"Village Plumbing, Air & Electric","note":"Long-established Houston independent serving homeowners since 1946; its local brand explicitly markets all three trades and has a visible 56-employee LinkedIn footprint."}],"rollup_activity":"The clearest recent Houston-area transaction is Southern Home Services’ October 2025 acquisition of Nick’s Plumbing & Air Conditioning, expanding its Texas footprint; Southern is a Gryphon Investors-backed 15-brand residential HVAC/plumbing/electrical platform. The local consolidation trail also includes Apex’s February 2020 acquisition of Air Tech and HomeTown Services’ September 2021 acquisition of John Moore, while Apex announced an Apollo Funds/Alpine strategic investment in May 2026."},"phoenix":{"market_snapshot":"Phoenix-Mesa-Chandler is a roughly 5.19-million-person metro (ACS 2024), with Pinal County above 502,000 and growing 3.7% in the latest Arizona OEO estimate—strong territory expansion for home-service capacity. The operator set is already meaningfully consolidated across PE-backed multi-brand platforms and franchise systems, but large family-owned Chas Roberts remains; recurring desert heat, including lower-desert readings above 110°F in National Weather Service reporting, plus population growth supports year-round cooling, replacement, installation, plumbing, and electrical demand. ARS/Rescue Rooter is a major national platform (GI Partners was reported as its majority owner in March 2026), but the current sources retrieved did not unambiguously prove a Phoenix branch or a Day & Night/ARS tie, so it is not counted as a local buyer row below.","buyers":[{"trades":"HVAC, plumbing, electrical","parent":"Apex Service Partners (Alpine Investors; Apollo Funds minority investment announced May 2026, expected Q4 2026 close)","type":"pe_rollup_brand","company":"ACE Home Services","note":"Phoenix-metro-facing multi-trade brand; Apex acquired ACE on 9 May 2022, giving an AI call-center vendor a direct route into a large national platform."},{"trades":"HVAC, plumbing, electrical","parent":"Wrench Group (TSG Consumer Partners, Oak Hill Capital, Leonard Green & Partners)","type":"pe_rollup_brand","company":"Parker & Sons","note":"Longstanding Phoenix anchor dating to 1974; Wrench publicly describes a 26-market, 15-state group and Parker & Sons as its Phoenix-area brand."},{"trades":"HVAC, plumbing","parent":"Goettl Home Services (Cortec Group)","type":"pe_rollup_brand","company":"Goettl Air Conditioning & Plumbing","note":"Large multi-state platform with a substantial Phoenix footprint, 24/7 HVAC/plumbing demand, and Cortec-backed capacity for add-on growth."},{"trades":"HVAC, plumbing, electrical","parent":"Champions Group (Blackstone agreement announced February 2026; closing status not stated in the cited release)","type":"pe_rollup_brand","company":"Hobaica Services","note":"Established Phoenix multi-trade operator; Service Champions acquired Hobaica in May 2021 after its ProSkill Phoenix acquisition, and the platform later agreed to be acquired by Blackstone."},{"trades":"HVAC","parent":"Neighborly (KKR; latest explicit ownership source found is the 2021 acquisition announcement)","type":"franchise","company":"Aire Serv of East Valley","note":"Active local franchise serving Gilbert/East Valley homeowners; Neighborly's large franchise network makes standardized booking and CSR automation particularly relevant."},{"trades":"HVAC, plumbing","parent":"independent (company site says family-owned)","type":"large_independent","company":"Chas Roberts","note":"A major Arizona residential anchor: the company describes itself as the largest and oldest residential HVAC provider and has operated since 1942."}],"rollup_activity":"Phoenix-specific consolidation includes Rocket Group's announced acquisition of Veterans AC PHX in November 2025. The regional roll-up chain also includes Service Champions' May 2021 Hobaica acquisition after its December 2020 ProSkill Phoenix purchase; in February 2026 Blackstone announced an agreement to acquire Champions Group from Odyssey, while Cortec's January 2022 Goettl investment and Apex/Alpine's May 2026 Apollo minority-investment announcement show continuing platform-level capital activity."},"atlanta":{"market_snapshot":"The best current regional growth signal is the Atlanta Regional Commission's Atlanta-region measure (broader than the four-county cut): 5,285,474 people in April 2025, up 64,400 from April 2024. Residential service demand is structurally recurring because HVAC penetration is about 90% of U.S. homes and Georgia has meaningful cooling-degree-day exposure; PE-backed platforms now sit alongside family-owned shops, indicating active consolidation in a still-fragmented market.","buyers":[{"trades":"HVAC, plumbing, electrical","parent":"Wrench Group (Leonard Green & Partners majority; TSG Consumer Partners and Oak Hill Capital minority)","type":"pe_rollup_brand","company":"Coolray Heating & Air Conditioning","note":"Atlanta-centered Wrench cluster; official brand pages link Coolray with Mr. Plumber and BriteBox Electrical, while Coolray markets all three trades across metro Atlanta."},{"trades":"HVAC, plumbing","parent":"TurnPoint Services (OMERS Private Equity; acquired in 2020)","type":"pe_rollup_brand","company":"Cool Air Mechanical","note":"TurnPoint's continuing Atlanta-region operating brand, with heating, cooling, ventilation, water-heater and plumbing services; the parent platform also covers electrical."},{"trades":"HVAC, plumbing","parent":"American Residential Services (GI Partners majority; Charlesbank Capital Partners and management)","type":"pe_rollup_brand","company":"ARS/Rescue Rooter Atlanta","note":"National residential platform with a Norcross location at 1465 Beaver Ruin Road; GI Partners' majority ownership was still reported in March 2026."},{"trades":"HVAC","parent":"Neighborly (KKR; acquired in Q3 2021)","type":"franchise","company":"Aire Serv of North Atlanta","note":"Local Sandy Springs franchise with a clear North Atlanta presence; its local page positions heating and air conditioning as the specialty."},{"trades":"HVAC, plumbing, electrical","parent":"independent (family-owned; no PE sponsor identified in the reviewed sources)","type":"large_independent","company":"Bardi Heating, Cooling, Plumbing, Electrical","note":"Norcross-based Greater Atlanta all-trades operator; publicly presented as family-owned, BBB A+, and highly reviewed."},{"trades":"HVAC, plumbing, electrical","parent":"independent (family-owned; no PE sponsor identified in the reviewed sources)","type":"large_independent","company":"Estes Services","note":"Legacy Atlanta operator that marked 75 years in 2024 and serves residential and commercial customers across HVAC, plumbing and electrical."}],"rollup_activity":"Recent named activity includes Wrench's February 2024 acquisition of Atlanta-based Andrews, which provides HVAC, plumbing and electrical services and complements Coolray. In March 2026 Reuters reported that ARS was exploring a $3.5 billion-plus sale (GI Partners majority, Charlesbank existing investor)—a sale process rather than a completed ownership change; no verified 2025-26 Atlanta operating-brand acquisition by Apex, Leap, Sila or Horizon was found in the reviewed sources."},"chicago":{"market_snapshot":"Cook County alone had 2,292,484 housing units as of July 1, 2025, and Will County added 259,218, so the defined four-county territory is a very large residential-services base even before adding DuPage and Lake. Demand is strongly weather- and urgency-driven: NOAA/NWS heating and cooling degree days are explicitly tied to temperatures relative to 65°F, while local operators advertise 24/7 service and report substantial emergency-call volume. Consolidation is meaningful but incomplete: Sila added two Chicagoland operators in 2025 and Four Seasons has an active investment/acquisition program, alongside sizable privately held or employee-owned locals such as ABC and American Weathermakers.","buyers":[{"trades":"HVAC, plumbing, electrical","parent":"Sila Services (Goldman Sachs Alternatives)","type":"pe_rollup_brand","company":"AA Service Company (with Ahrens & Condill and Tangney & Sons)","note":"Sila identifies AA Service Company as its lead Chicago-region brand; its August 2025 release added Ahrens & Condill and Tangney & Sons to a 35-plus-brand residential-services platform."},{"trades":"HVAC, plumbing, electrical","parent":"Cortec Group (Fund VII)","type":"pe_rollup_brand","company":"Four Seasons Heating & Air Conditioning","note":"Cortec lists the Chicago-headquartered company as Fund VII-owned and a leading Chicagoland HVAC, plumbing, and electrical provider; Four Seasons lists multiple suburban locations and trucks throughout the metro."},{"trades":"HVAC, plumbing","parent":"American Residential Services (GI Partners majority owner; Charlesbank also invested)","type":"pe_rollup_brand","company":"ARS/Rescue Rooter Chicagoland","note":"ARS/Rescue Rooter advertises greater-Chicagoland plumbing, air-conditioning, and furnace repair, while a March 2026 Reuters report identifies GI Partners as the majority owner of the national platform."},{"trades":"plumbing","parent":"Neighborly (KKR announced the acquisition in 2021; no later ownership change was identified in the reviewed sources)","type":"franchise","company":"Mr. Rooter Plumbing of Chicago","note":"The official location directory lists a Chicago franchise plus suburban contact locations; Neighborly's transaction release described a 4,800-plus-franchise network, making the platform a high-value CSR/software target."},{"trades":"HVAC, plumbing, electrical","parent":"independent / privately held (current sponsor not publicly identified in the reviewed sources)","type":"large_independent","company":"ABC Plumbing, Sewer, Heating, Cooling & Electric","note":"A broad Chicagoland operator with plumbing, sewer, heating, cooling, and electric services and more than 70 years of local operating history."},{"trades":"HVAC, plumbing","parent":"independent / employee-owned","type":"large_independent","company":"American Weathermakers","note":"Northbrook-based employee-owned operator serving Chicago's North Shore and northwest suburbs since 1949; it reports 70-plus years of experience, tens of thousands of completed jobs, and hundreds of emergency calls annually."}],"rollup_activity":"On August 4, 2025, Sila Services announced the acquisitions of Ahrens & Condill and Tangney & Sons Plumbing and Sewer in greater Chicago, adding to AA Service Company, its lead Chicago-region brand. Four Seasons says it partnered with a leading investment firm in 2022 and is actively seeking strategic acquisitions; Cortec's current portfolio page lists Four Seasons as Fund VII-owned."},"msp":{"market_snapshot":"The four specified counties total 2,714,538 residents on Minnesota's April 1, 2025 estimates (Hennepin 1,313,127; Ramsey 557,123; Dakota 462,169; Anoka 382,119); Hennepin, Dakota, and Anoka added 31,562, 22,287, and 18,232 residents respectively from 2020 to 2025, and the Metropolitan Council's latest housing-stock series describes 2024. There are visible signs of consolidation: Gridiron Capital made a growth investment in Legacy Service Partners, while Redwood reports a platform of more than 2,500 employees and $500 million in annual revenue and announced a significant Altas Partners equity investment in May 2025. Demand is year-round because official Twin Cities climate sources track both heating and cooling degree days, while the leading local operators bundle plumbing and electrical work with seasonal HVAC.","buyers":[{"trades":"HVAC, plumbing/drains, electrical (multi-brand cluster)","parent":"Legacy Service Partners (Gridiron Capital growth investment, announced January 2023)","type":"pe_rollup_brand","company":"Blue Ox Heating & Air / Paul Bunyan Plumbing & Drains (Legacy Twin Cities cluster)","note":"Legacy's official partner directory includes Blue Ox and Paul Bunyan; its December 2025 acquisition dossier also lists HomeWorks, Comfort Matters, EarlyBird and Ouverson in Minnesota, creating dense multi-brand coverage."},{"trades":"HVAC, plumbing, electrical, sewer, drain","parent":"Redwood Services (Altas Partners significant equity investment, May 2025)","type":"pe_rollup_brand","company":"Dean's Home Services","note":"Redwood's May 2024 investment announcement calls Dean's a leading Twin Cities provider; Dean's reports more than 120 teammates and more than 10,000 annual customers."},{"trades":"Plumbing","parent":"Authority Brands (franchisor)","type":"franchise","company":"Benjamin Franklin Plumbing of Minneapolis and St. Paul","note":"Authority Brands identifies itself as the parent company for Benjamin Franklin Plumbing, and the local Minneapolis page gives a franchise address in Ramsey, Minnesota."},{"trades":"HVAC, plumbing, electrical, drain","parent":"independent (100% family-owned; Pete Bonfe)","type":"large_independent","company":"Bonfe Plumbing, Heating, Cooling, Electrical & Sewer","note":"Bonfe is a broad multi-trade Twin Cities provider; its July 2025 owner statement says the company is 100% family-owned, making it a major non-roll-up target."},{"trades":"HVAC, plumbing, electrical","parent":"independent (locally owned family business)","type":"large_independent","company":"Genz-Ryan","note":"Genz-Ryan says it has provided plumbing, HVAC and electrical service in Minneapolis–St. Paul since 1950 and describes itself as a locally owned family business."}],"rollup_activity":"On January 18, 2023, Gridiron Capital announced a growth investment in Legacy Service Partners; Legacy's official partner directory lists Blue Ox and Paul Bunyan, and a December 6, 2025 dossier lists a Minnesota cluster including HomeWorks, Comfort Matters, EarlyBird and Ouverson. Redwood invested in Dean's Home Services in May 2024 (Dean's reports more than 120 teammates and more than 10,000 annual customers); Altas Partners announced a significant equity investment in Redwood on May 8, 2025."},"denver":{"market_snapshot":"The defined four-county market is a large installed base: Denver County alone had 375,287 housing units as of July 1, 2025, while the local operator set still includes a large family-owned incumbent alongside multiple PE-backed platforms. Consolidation is active rather than complete—the national HVAC sector recorded 55 deals in 2024, up 72% from 2023, and Denver-area add-ons/entries include Swan, M&M, Tuscan and Doctor Fix-It; recurring heating/cooling needs in Colorado's cold climate, plus essential plumbing and electrical repairs, support year-round service and call volume.","buyers":[{"trades":"HVAC, plumbing, electrical","parent":"Wrench Group (Leonard Green & Partners and management majority; TSG Consumer Partners and Oak Hill minority per latest located disclosure, Nov. 2022)","type":"pe_rollup_brand","company":"Plumbline Services","note":"Wrench acquired the Denver operator in May 2018; Plumbline has served Denver since 1998 and offers plumbing, HVAC and electrical services."},{"trades":"HVAC, plumbing, electrical","parent":"Champions Group Holdings (Blackstone agreed to acquire it in Feb. 2026; Odyssey Investment Partners was the prior sponsor)","type":"pe_rollup_brand","company":"Swan Heating & Air Conditioning / M&M Heating, Cooling, Plumbing & Electrical","note":"The platform has two highly relevant local brands: Swan serves the Denver/Loveland area, and M&M is a Longmont operator whose acquisition strengthened Champions' Denver footprint."},{"trades":"Electrical, heating/HVAC, plumbing","parent":"The SEER Group (Genstar Capital and Ares Management are the latest investor relationship found)","type":"pe_rollup_brand","company":"Tuscan Electric, Heating & Plumbing","note":"SEER announced the Denver-metro acquisition on Sept. 4, 2025, making it a recent platform entry and a likely centralized-CSR buyer."},{"trades":"HVAC, plumbing, electrical","parent":"Service Experts (Brookfield Infrastructure)","type":"pe_rollup_brand","company":"Service Experts Denver","note":"The Westminster/Denver operation is part of a large national HVAC/plumbing/electrical platform reported at roughly $1 billion in revenue in 2026, making it a high-value enterprise target."},{"trades":"HVAC, plumbing, electrical","parent":"American Residential Services / ARS (GI Partners majority owner; Charlesbank Capital Partners existing investor as of March 2026)","type":"pe_rollup_brand","company":"ARS/Rescue Rooter of Colorado","note":"ARS has a Denver operation and combines corporate scale with multi-trade residential service; Reuters reported a potential sale exploration but no completed sale in the source reviewed."},{"trades":"Plumbing, heating/HVAC, cooling, drain cleaning, electrical","parent":"independent","type":"large_independent","company":"Applewood Plumbing Heating & Electric","note":"The company describes itself as Denver's largest family-owned home-repair company, with nearly 200 employees, more than 100 service trucks and 350,000+ customers."}],"rollup_activity":"Denver consolidation has included Service Champions' acquisition of Swan in August 2021 and M&M of Longmont announced in December 2022 (published in 2023), followed by The SEER Group's Tuscan acquisition on September 4, 2025. More recently, Blackstone agreed to acquire Champions from Odyssey on February 17, 2026 (expected close in the first half of 2026), and Advantage Services Group acquired Denver-area Doctor Fix-It in July 2026—an add-on whose sponsor relationship is tied to MRE Capital in the latest portfolio-company listing found."},"tampa":{"market_snapshot":"The tri-county market has a strong growth and housing-demand signal: between 2018 and 2023 it added nearly 100,000 households but only 82,000 housing units, and the Tampa Bay Partnership says about 254,700 more units—an average of 21,225 per year—are needed by 2035. Consolidation is meaningful but not complete: PE-backed/multi-brand platforms and national franchise brands operate alongside independent multi-trade shops. Tampa's humid-subtropical climate, including a hot and humid May–October season, supports recurring cooling, replacement and maintenance demand, while ongoing household and housing additions create plumbing and electrical installation/repair demand; no reliable public metro-specific revenue/TAM figure surfaced, so household and housing metrics are the best size proxies here.","buyers":[{"trades":"HVAC, plumbing, electrical","parent":"Wrench Group (Leonard Green & Partners majority; TSG Consumer Partners and Oak Hill Capital minority)","type":"pe_rollup_brand","company":"CoolToday","note":"Wrench acquired the Tampa/Sarasota heritage brand in 2019; Wrench is a multi-trade residential home-services platform and its latest 2026 ownership reporting retains the same sponsor structure."},{"trades":"HVAC, plumbing, electrical","parent":"Master Trades Group (formerly LTP Home Services Group; L Catterton)","type":"pe_rollup_brand","company":"Acree Plumbing, Air & Electric","note":"Tampa residential multi-trade operator acquired by LTP in February 2023; L Catterton currently identifies the platform as Master Trades Group (fka LTP)."},{"trades":"HVAC, plumbing, electrical","parent":"Apex Service Partners (Alpine Investors)","type":"pe_rollup_brand","company":"Frank Gay Services","note":"Alpine launched Apex with the Frank Gay acquisition in August 2025; Frank Gay's official site lists a Tampa address and all three residential trades."},{"trades":"HVAC, plumbing, electrical","parent":"American Residential Services / ARS (GI Partners majority; Charlesbank Capital Partners investor)","type":"pe_rollup_brand","company":"ARS/Rescue Rooter Tampa Bay","note":"National multi-trade platform with a St. Petersburg branch and greater Tampa/St. Petersburg coverage; ARS's Tampa-area service territory includes Hillsborough, Pasco and Pinellas, and GI Partners is reported as majority owner in 2026."},{"trades":"Plumbing","parent":"Neighborly (franchisor)","type":"franchise","company":"Mr. Rooter Plumbing of Tampa Bay","note":"Local 24/7 franchise operator described as locally and independently owned, serving at least Pasco and Pinellas; Neighborly identifies Mr. Rooter as its subsidiary."},{"trades":"HVAC, plumbing, electrical","parent":"independent","type":"large_independent","company":"ACS Home Services","note":"Prominent Tampa multi-trade shop founded in 2014; the structured record shows it as Tampa-based and unfunded, and no PE sponsor was found in the reviewed sources."}],"rollup_activity":"Documented local consolidation includes Wrench's acquisition of CoolToday (March 2019), LTP's acquisition of Acree (February 2023), and Alpine's launch of Apex Service Partners with Frank Gay (August 2025). In June 2025, Air Pros founder Anthony Perera reacquired the legacy Florida operations through Exuma Capital Partners, adding another recent PE-backed ownership/platform change relevant to Tampa."},"philly":{"market_snapshot":"The full Philadelphia-Camden-Wilmington MSA benchmark contained 6,330,422 people in ACS 2024; the HUD Philadelphia HMA (Philadelphia and Delaware counties, a subset of the requested geography) had an estimated 2.13 million people and 901,950 households as of July 1, 2024, with households forecast to grow 0.7% annually over the next three years. The operator set is active rather than fully consolidated: Sila, Horizon/Strikepoint, Service Experts/Enercare and franchise networks coexist with strong local independents, while PitchBook data cited in 2024 put national private-equity purchases at nearly 800 HVAC, plumbing and electrical companies since 2022. Service demand is weather-sensitive and recurring: Philadelphia's ASHRAE 4A climate implies high summer cooling and significant winter heating demand, while 24/7 repair, replacement, plumbing/electrical, water-heater and home-performance offerings create ongoing CSR/call volume.","buyers":[{"trades":"HVAC, plumbing, electrical; water treatment, indoor air quality and home performance","parent":"Goldman Sachs Alternatives (Private Equity at Goldman Sachs Asset Management)","type":"pe_rollup_brand","company":"Sila Services / Sila Philadelphia","note":"King of Prussia-headquartered platform serving the Northeast, Mid-Atlantic and Midwest; its current site identifies it as a Goldman Sachs Alternatives portfolio company, following the 2024 majority-investment announcement."},{"trades":"HVAC, plumbing, electrical and water treatment","parent":"Strikepoint Group Holdings (current platform; current sponsor not publicly identified in the reviewed sources)","type":"pe_rollup_brand","company":"Horizon Services","note":"A current Strikepoint family brand with local markets including Audubon, PA and Mount Laurel, NJ; Horizon also describes coverage across southeastern Pennsylvania and southern New Jersey and calls itself one of the largest home-services companies in the United States."},{"trades":"HVAC, plumbing and electrical nationally; Philadelphia page emphasizes HVAC and plumbing","parent":"Enercare (Brookfield Infrastructure; no newer ownership change found in the reviewed sources)","type":"pe_rollup_brand","company":"Service Experts Philadelphia (formerly Stallion / Wesley Wood)","note":"National platform with a current Greater Philadelphia operation; the local page identifies the former Wesley Wood brand, and Service Experts announced its acquisition of Philadelphia-based Stallion in 2022."},{"trades":"HVAC","parent":"Authority Brands (franchisor; local Bucks County franchisee)","type":"franchise","company":"One Hour Heating & Air Conditioning — Levittown/Bucks County","note":"The official local page says Levittown technicians provide 24/7 AC and heating repair, installation and maintenance throughout Bucks County; Authority Brands' own case study lists One Hour with its Mister Sparky and Benjamin Franklin Plumbing brands."},{"trades":"HVAC, plumbing, electrical; indoor air quality, generators and water/sewer lines","parent":"independent (second-generation, privately held)","type":"large_independent","company":"Oliver Heating & Cooling","note":"A major Delaware Valley operator based in Morton since 1971, with a second-generation owner and a full multi-trade offering across Delaware Valley and Southeastern Pennsylvania."},{"trades":"Plumbing, HVAC and electrical; excavation","parent":"independent","type":"large_independent","company":"McClain Bros.","note":"Locally owned and operated since 1995, based in Levittown, available 24/7 and explicitly serving Philadelphia, Bucks and Montgomery counties with all three target trades."}],"rollup_activity":"In the target market, Service Experts announced on September 9, 2022 that it had acquired substantially all assets of Philadelphia-based Stallion Heating, Plumbing & Air Conditioning; its current Philadelphia page identifies the operation as formerly Wesley Wood Service Experts. Regional platform-building continued at Sila with the Triangle Heating, Cooling, Plumbing & Electrical acquisition in Central Pennsylvania (November 30, 2023), the Gary & Sons acquisition in Pennsylvania (July 3, 2024), and Goldman Sachs' announced majority investment in Sila (November 12, 2024); the Sila tuck-ins are Pennsylvania-region signals and are not all inside the five counties plus Camden."},"nashville":{"market_snapshot":"The four-county core sits in a fast-growing Nashville market: the MSA added 86 people per day in 2023, and Davidson, Rutherford, Williamson and Wilson were all among the six Tennessee counties with the largest population gains from 2021 to 2023; Davidson added 10,413 residents in 2024, while Rutherford and Wilson added 7,347 and 5,596. Nashville-Davidson's 2020-2024 owner-occupied rate was 52.4% and the median value of owner-occupied homes was $413,600; combined with Nashville's humid-subtropical climate, that supports recurring HVAC/heating, indoor-air-quality, plumbing and electrical repair/replacement demand. The provider set is consolidating but remains mixed rather than dominated by one platform: PE-backed roll-ups, franchise networks and substantial family-owned independents coexist.","buyers":[{"trades":"HVAC, plumbing, electrical","parent":"Wrench Group (PE-backed; Nov. 2022 recapitalization: Leonard Green & Partners/management retained majority; TSG Consumer Partners and Oak Hill Capital invested)","type":"pe_rollup_brand","company":"Coolray (Nashville)","note":"Coolray is a Wrench Group company, opened its first Nashville location in November 2022, and Wrench's current site reports 26 markets across 15 states; the latest sponsor disclosure reviewed is the 2022 recapitalization."},{"trades":"HVAC, plumbing, electrical","parent":"American Residential Services / ARS (GI Partners; current lead investor)","type":"pe_rollup_brand","company":"ARS/Rescue Rooter Nashville","note":"The greater-Nashville operation provides HVAC and plumbing locally, while ARS's network covers electrical as well; ARS is one of the nation's largest residential HVAC/plumbing providers and GI Partners is identified as current lead investor."},{"trades":"HVAC, plumbing, electrical","parent":"Concentric Equity Partners (controlling equity at Leap Partners' 2022 formation; no later sponsor change located)","type":"pe_rollup_brand","company":"Leap Partners (Nashville-based platform)","note":"A platform-level AI/CSR target: Leap connects a 14-company HVAC/plumbing/electrical portfolio across six states and announced 34 Tennessee/West Virginia acquisitions by July 2026; public sources reviewed do not name a specific Davidson/Rutherford/Williamson/Wilson operating brand."},{"trades":"HVAC; electrical through a local sister brand","parent":"Neighborly (franchisor; KKR acquisition announced in 2021; current sponsor not re-disclosed in the current local pages)","type":"franchise","company":"Aire Serv of Nashville (with Mr. Electric of Central Nashville)","note":"Aire Serv is a leading local HVAC repair/maintenance provider, while Mr. Electric supplies local electrical coverage; franchise locations are independently owned and operated, making the network a relevant multi-brand CSR buyer."},{"trades":"HVAC, plumbing, electrical, appliance repair, facility services","parent":"independent / Lee family (family-owned)","type":"large_independent","company":"Lee Company","note":"A major regional independent: it serves four states from 15 locations, offers all three core trades plus adjacent services, and has a dedicated Nashville operation."},{"trades":"HVAC, plumbing, electrical","parent":"independent / Hiller family (family-owned; no PE parent stated in the current home-services source)","type":"large_independent","company":"Hiller Plumbing, Heating, Cooling & Electrical","note":"Family-owned and operated since 1990, with a Nashville branch and a service fleet the company describes as the largest in Davidson County; its local page covers plumbing, heating/AC and electrical services."}],"rollup_activity":"Coolray/Wrench Group opened Coolray's first Nashville location in early November 2022; Wrench's November 2022 recapitalization added TSG Consumer Partners and Oak Hill Capital while Leonard Green & Partners and management retained majority control. Leap Partners was formed with controlling equity from Concentric Equity Partners on March 24, 2022, and its July 2026 announcement said it had acquired 34 HVAC, plumbing and electrical companies across Tennessee and West Virginia, although the public announcement does not identify how many are in the four-county core."},"kc":{"market_snapshot":"HUD’s broader Kansas City HMA (report as of January 1, 2024; not a five-county-only forecast) projected demand for 16,200 rental units and 16,050 sales units from January 2024 through January 2027, with 7,925 rental units and 2,170 homes under construction at the report date—a strong growth signal for the residential service base. The operator set is mixed rather than fully consolidated: family-owned independents such as LBA and Anthony sit alongside Apex/Southern Home Services roll-up brands and Neighborly franchisees, while the A.B. May/Frontier-to-Apex and Mission/Ultra transactions show active consolidation. Service demand is driven by seasonal heating/cooling and 24/7 emergency repair/replacement, plumbing/sewer/drain work, and electrical/IAQ upgrades; an exact five-county market-size/share figure and the legal names of local franchise owners were not established in the reviewed sources.","buyers":[{"trades":"HVAC, plumbing, drains/sewer, electrical","parent":"Apex Service Partners (Alpine Investors; Apollo Funds definitive minority-interest agreement announced May 2026, expected to close Q4 2026)","type":"pe_rollup_brand","company":"A.B. May Heating, A/C, Plumbing & Electrical","note":"Long-running Kansas City multi-trade brand with a 50-mile service radius; Frontier Service Partners’ sale put it into Apex in January 2024."},{"trades":"HVAC, plumbing","parent":"Southern Home Services (majority-owned by Gryphon Investors per the October 2021 announcement)","type":"pe_rollup_brand","company":"Mission Plumbing, Heating & Cooling","note":"Greater-Kansas-City operator; Southern Home Services acquired it in 2021 and Mission acquired Ultra Heating & Cooling effective April 7, 2025."},{"trades":"Plumbing, sewer/drain","parent":"Neighborly (franchisor)","type":"franchise","company":"Mr. Rooter Plumbing of Kansas City","note":"Locally owned and independently operated franchise with multi-city Kansas City coverage and emergency plumbing/sewer services."},{"trades":"HVAC, indoor air quality","parent":"Neighborly (franchisor)","type":"franchise","company":"Aire Serv of Kansas City South","note":"Locally owned and independently operated HVAC franchise serving Kansas City South and nearby Jackson County communities."},{"trades":"HVAC, plumbing, electrical","parent":"Independent / family-owned; no PE parent identified in reviewed sources","type":"large_independent","company":"LBA Services","note":"Founded in 1985, family-owned and operated, with Kansas City-area locations and a broad metro service-area list."},{"trades":"Plumbing, HVAC, electrical","parent":"Independent / local proprietor; no PE parent identified in reviewed sources","type":"large_independent","company":"Anthony Plumbing, Heating, Cooling & Electric","note":"Founded in 1951; the company reports more than 300 workers and three locations in Lenexa, Independence, and North Kansas City."}],"rollup_activity":"On January 23, 2024, Apex Service Partners closed its purchase of Frontier Service Partners, whose Midwest platform included Kansas City’s A.B. May. On April 7, 2025, Mission Plumbing, Heating & Cooling—already acquired by Southern Home Services in April 2021—acquired Ultra Heating & Cooling in the Kansas City market; Southern Home Services’ majority ownership by Gryphon Investors was announced in October 2021."},"stl":{"market_snapshot":"The broader St. Louis MO-IL metro—used as a size proxy because it is not identical to the specified five-county core—had 2,809,527 residents in the 2024 ACS profile; St. Louis City's building-permit dashboard reported 4,073 permits in 2024 across commercial, industrial and residential categories, providing a current activity signal. Consolidation is meaningful but incomplete: Apex and Neighborly bring platform/franchise scale, while Hoffmann Brothers, Jerry Kelly and Scott-Lee remain local founder/family-led buying centers. Demand is weather-driven and recurring: the National Weather Service tracks both heating-degree days and cooling-degree days for St. Louis, while an aging U.S. housing stock—over 40% of occupied homes built before 1970—supports ongoing repair, replacement and maintenance demand (the housing-age statistic is national, not St. Louis-specific).","buyers":[{"trades":"HVAC, plumbing, electrical","parent":"Apex Service Partners (Alpine Investors; Apollo Funds strategic minority investor announced May 2026)","type":"pe_rollup_brand","company":"Academy Air","note":"Apex acquired/invested in the St. Louis brand in July 2020; it is a direct local entry point into a national multi-trade roll-up whose current investor stack includes Alpine and Apollo."},{"trades":"HVAC, plumbing, electrical","parent":"HB Solutions Group / Deutschmann Lane Holdings (founder-led; no PE sponsor identified in the reviewed sources)","type":"large_independent","company":"Hoffmann Brothers","note":"A prominent St. Louis-based multi-trade operator serving St. Louis and Nashville; HB Solutions operates the Hoffmann Bros. brands and was consolidating them at an Earth City campus in 2026."},{"trades":"HVAC, plumbing, electrical","parent":"Neighborly (KKR; local locations independently owned and operated)","type":"franchise","company":"Neighborly of St. Louis (Mr. Electric / Mr. Rooter / Aire Serv)","note":"The local Fenton/Kirkwood network combines identifiable electrical, plumbing and HVAC franchise demand with a national multi-brand franchisor and independently owned local units."},{"trades":"HVAC, plumbing, electrical","parent":"independent","type":"large_independent","company":"Jerry Kelly Heating, Air Conditioning, Plumbing & Electrical","note":"Its site explicitly covers Greater St. Peters, St. Louis County and St. Charles County across cooling/heating, plumbing/drains and electrical; co-owner Steve Miles is publicly identified."},{"trades":"HVAC","parent":"independent","type":"large_independent","company":"Scott-Lee Heating Company","note":"A long-standing greater-St. Louis HVAC operator that remained family-owned and operated in the July 2025 local profile; Terrance Scott and Russ Scott are identified as owners."},{"trades":"Electrical","parent":"Authority Brands (franchisor)","type":"franchise","company":"Mister Sparky of Southwest St. Louis","note":"A current local franchise providing residential wiring/electrical work in Southwest St. Louis, backed by the Authority Brands family that also includes One Hour and Mister Sparky."}],"rollup_activity":"The clearest locally documented residential-trades platform activity was in 2022: Heartland Home Services announced its acquisition of Faszold Heating & Cooling in St. Louis in March, and Royal House Partners added Sinak Plumbing, based in St. Louis, in September. Apex's Academy Air transaction dates to July 2020; more recently, HB Solutions' January 2026 Earth City move consolidated Hoffmann Bros. and its 2023-acquired Ferguson Roofing, although Ferguson is roofing rather than one of the three focal trades."},"detroit":{"market_snapshot":"A Census Reporter profile lists 4,400,578 people for the broader Detroit-Warren-Dearborn metro, while Detroit-specific housing research says old housing stock, high poverty, and an aging population intensify home-repair demand. The evidence shows a mix of local operators and franchisees overlaid by PE roll-ups and national franchisors; as a sector-wide signal, PitchBook reported a record 55 HVAC PE deals in 2024, up 72% from 2023, and Heartland describes residential HVAC, plumbing, and electrical services as non-discretionary demand.","buyers":[{"trades":"HVAC, electrical","parent":"Heartland Home Services (TJC sponsor; Cobepa minority; latest explicit ownership evidence December 2020, with TJC portfolio status Current)","type":"pe_rollup_brand","company":"Randazzo Heating, Cooling & Electrical","note":"Macomb-based local platform brand serving Southeast Michigan/Metro Detroit; Heartland lists it as Michigan's largest award-winning heating-and-cooling company, making it a logical multi-location call-center/CSR target."},{"trades":"HVAC, plumbing, electrical","parent":"Heartland Home Services (TJC sponsor; Cobepa minority; latest explicit ownership evidence December 2020, with TJC portfolio status Current)","type":"pe_rollup_brand","company":"FLAME Heating, Cooling, Plumbing & Electrical","note":"Warren-based multi-trade brand with explicit Macomb, Oakland, and Wayne coverage and a 1949 local legacy; it provides a broad tri-county operating footprint within the Heartland platform."},{"trades":"Plumbing","parent":"Neighborly (KKR; latest official confirmation says acquired in Q3 2021; later ownership change not separately confirmed in reviewed sources)","type":"franchise","company":"Mr. Rooter Plumbing of Detroit","note":"The local franchise explicitly serves Macomb, Oakland, and Wayne counties and is part of Neighborly, making it a logical franchise-system call-center/CSR target."},{"trades":"HVAC","parent":"Authority Brands (Apax Partners; Apax portfolio page lists the relationship as Current)","type":"franchise","company":"One Hour Heating & Air Conditioning of Southfield","note":"Authority Brands' Michigan page lists a Southfield location and a Canton/Novi operation at a Livonia address, placing the network in Oakland and Wayne County parts of the target metro."},{"trades":"HVAC, plumbing","parent":"independent (family-owned)","type":"large_independent","company":"Kotz Heating, Cooling & Plumbing","note":"A since-1929 Waterford/Oakland County operator serving Waterford, Birmingham, Clarkston, Royal Oak, Walled Lake, and surrounding communities; no roll-up parent was identified in the sourced material."},{"trades":"HVAC, plumbing, electrical","parent":"independent (family-owned and operated)","type":"large_independent","company":"Home Service Corp.","note":"Melvindale-based since 1980, with more than 20 employees, thousands of Southeast Michigan homes served, and explicit HVAC/plumbing/electrical coverage; its breadth makes it a logical independent target."}],"rollup_activity":"Heartland Home Services acquired Ferndale-based Air Master Heating & Air Conditioning in June 2022, explicitly saying the deal gave it more bandwidth to serve Detroit; its current roster also includes Macomb-based Randazzo and Warren-based Flame. I did not find an authoritative 2025-26 announcement of a newer tri-county residential add-on, so Atrium/Great Dane and ARS/Andy's Statewide associations are left out rather than treated as confirmed local roll-up activity."},"boston":{"market_snapshot":"The wider Boston-Cambridge-Newton metro had about 5.03 million residents in 2024; 2024 estimates also reported net gains of 24,024 in Middlesex, 11,466 in Suffolk, and 8,375 in Norfolk, signaling a large and still-growing catchment even though the requested four counties are narrower than the full MSA. Demand is heating-led and increasingly tied to equipment replacement, emergency plumbing/electrical work, and electrification: NEEP's regional target calls for heat pumps to reach at least 65% of residential-scale heating, air-conditioning, and water-heating shipments by 2030. The market is fragmented but consolidating—Sila, Flint, ARS and Neighborly give PE/franchise platforms local footholds while long-lived owner-led firms such as Rodenhiser and Papalia remain visible competitors.","buyers":[{"trades":"HVAC, plumbing, electrical","parent":"Sila Services (Goldman Sachs Alternatives; announced majority-stake acquisition from Morgan Stanley Capital Partners in Nov. 2024)","type":"pe_rollup_brand","company":"Boston Standard Company / New England Ductless (Sila)","note":"Sila acquired the two Boston-area brands in January 2022 and now markets multi-trade service across Boston, making this the clearest local PE-platform target."},{"trades":"HVAC, plumbing, electrical (plus drains/sewer)","parent":"Flint Group (General Atlantic strategic investment; Skylight Capital lists Cranney as an active investment)","type":"pe_rollup_brand","company":"Cranney Home Services","note":"Danvers/North Shore operator acquired by Flint in January 2021; Flint identifies Boston as one of its primary platform markets."},{"trades":"HVAC, plumbing, electrical","parent":"American Residential Services / ARS (GI Partners majority owner; Charlesbank Capital Partners existing investor)","type":"pe_rollup_brand","company":"ARS/Rescue Rooter Boston","note":"Company-operated Stoughton location serves the Boston area, while ARS is a national multi-branch residential-services platform with current GI/Charlesbank backing."},{"trades":"Electrical","parent":"Neighborly (KKR is the latest disclosed buyer; local franchise is independently owned)","type":"franchise","company":"Mr. Electric of Boston South Metro","note":"Stoughton franchise gives Neighborly an in-county electrical foothold and a branded, independently operated service organization."},{"trades":"HVAC, plumbing, electrical","parent":"independent (Andy Rodenhiser-led)","type":"large_independent","company":"Rodenhiser Plumbing, Heating, AC & Electric","note":"Long-established local operator covering the Route 495/128 area; its site claims 97+ years and 14,000+ five-star reviews."},{"trades":"HVAC, plumbing, electrical","parent":"independent (Jim Papalia-founded)","type":"large_independent","company":"Papalia Home Services","note":"Boxborough/MetroWest operator founded in 1990 with dedicated HVAC, plumbing and electrical lines, plus 24/7 live answering."}],"rollup_activity":"The most directly Boston-area platform add-ons were Flint Group's acquisition of Danvers/North Shore Cranney Home Services (Jan. 6, 2021), Sila Services' acquisition of Boston Standard Company and New England Ductless (Jan. 26, 2022), and Cox Engineering's acquisition of Weymouth-based US Air (May 2022). Capital kept moving: Flint announced a strategic investment from General Atlantic in Aug. 2023, Boston Unique Indoor Comfort announced an Ace Hardware acquisition on Feb. 1, 2024, and Sila announced a majority-stake transaction with Goldman Sachs Alternatives from Morgan Stanley Capital Partners in Nov. 2024; the public releases do not all state final closing/ownership details."},"charlotte":{"market_snapshot":"The broader Charlotte-Concord-Gastonia MSA population series reports 2,884.708 in 2024 versus 2,818.271 in 2023, while the Charlotte Region gained 57,300 residents through migration from July 1, 2023 to July 1, 2024—strong growth signals for residential service demand, although the MSA is broader than the requested five-county target. The operator mix indicates partial consolidation—PE/franchise platforms coexist with family-owned locals—and Greater Charlotte permit reporting covers Cabarrus, Gaston, Mecklenburg and Union but not York in the retrieved source; Charlotte's climate is described as heat-pump-friendly with cool, not extreme winters, supporting recurring HVAC repair/replacement alongside plumbing and electrical work.","buyers":[{"trades":"HVAC, plumbing","parent":"Wrench Group (Leonard Green & Partners)","type":"pe_rollup_brand","company":"Morris-Jenkins","note":"Wrench's Charlotte entry; the deal source describes Morris-Jenkins as the region's largest HVAC/plumbing provider, making it a high-priority platform target."},{"trades":"HVAC, plumbing, electrical","parent":"Trilantic North America (invested 2021)","type":"pe_rollup_brand","company":"Strada Services","note":"A residential Southeast installation/services platform with a Charlotte page covering air conditioning, plumbing and electrical work."},{"trades":"HVAC, plumbing","parent":"American Residential Services (Charlesbank Capital Partners)","type":"pe_rollup_brand","company":"Brothers Air, Heat & Plumbing (ARS/Rescue Rooter)","note":"The local ARS operating brand has served greater Charlotte since 1985, combining local tenure with a large multi-trade platform."},{"trades":"HVAC","parent":"Authority Brands (franchisor)","type":"franchise","company":"One Hour Heating & Air Conditioning of Charlotte","note":"The Charlotte franchise has provided HVAC replacement and repair since 1971; Authority Brands added One Hour to its franchise portfolio in 2019."},{"trades":"HVAC, plumbing, electrical","parent":"independent","type":"large_independent","company":"Roby Services","note":"Family-owned, three generations since 1950, with all three residential trades and a long-standing Charlotte footprint."},{"trades":"HVAC, plumbing, electrical","parent":"independent","type":"large_independent","company":"Horne Heating and Air Conditioning","note":"A Charlotte family-owned operator with over 40 years of ownership and explicit HVAC, plumbing and electrical coverage."}],"rollup_activity":"Wrench Group's October 21, 2021 partnership/acquisition of Morris-Jenkins expanded Wrench into the Carolinas; the deal source identifies Morris-Jenkins as the Charlotte region's largest HVAC/plumbing provider. On May 19, 2022, Strikepoint Group Holdings announced the acquisition of Phillips Air Care's North Charlotte location, while Strada's residential Southeast platform was sold to Trilantic North America in December 2021 (Trilantic lists the investment as 2021)."},"sanantonio":{"market_snapshot":"Within the defined footprint, Bexar County's July 2025 population estimate was 2,160,088, while Comal County grew 27.8% from 163,608 in 2020 to 209,166 in 2025; as a broader metro proxy, the San Antonio-New Braunfels MSA series reached 2,813.140 thousand residents in 2025 versus 2,605.822 thousand in 2021. The trade base remains fragmented even as PE platforms and franchisors consolidate contractors; rapid population growth and recurring extreme heat—with local forecasts reaching 102°F and heat-index values above 105°F—support HVAC replacement/repair and adjacent plumbing/electrical demand.","buyers":[{"trades":"HVAC, plumbing","parent":"Wrench Group (Leonard Green & Partners/management majority; TSG Consumer Partners and Oak Hill investment announced in 2022; Goettl-to-Wrench linkage should be rechecked)","type":"pe_rollup_brand","company":"Goettl Air Conditioning & Plumbing — San Antonio","note":"The official local page gives a San Antonio address and 24/7 HVAC/plumbing service; Wrench's sponsor trail makes it a high-priority platform target, but the retrieved Goettl page does not itself name the parent."},{"trades":"HVAC, plumbing, electrical","parent":"T3 Services Group / Riverside Company (Riverside acquired Radiant in May 2021)","type":"pe_rollup_brand","company":"Radiant Plumbing & Air Conditioning — San Antonio","note":"Radiant advertises South Texas HVAC, plumbing and electrical service, and the T3/Riverside trail identifies a platform entry into San Antonio."},{"trades":"HVAC, plumbing, electrical","parent":"American Residential Services / ARS-Rescue Rooter (GI Partners made a majority investment in 2020; Charlesbank is the historical sponsor reference)","type":"pe_rollup_brand","company":"Will Fix It","note":"ARS's San Antonio location lists air conditioning, heating, plumbing, drain cleaning, insulation and electrical under the Will Fix It brand, making it a scaled multi-trade call-center target."},{"trades":"plumbing","parent":"Neighborly (KKR agreed to acquire the franchisor in July 2021; a later 2025-26 ownership change was not publicly confirmed in the retrieved sources)","type":"franchise","company":"Mr. Rooter Plumbing of West San Antonio – Alamo Ranch","note":"The local Mr. Rooter page confirms a West San Antonio/Alamo Ranch operation; Aire Serv of Stone Oak is an additional local Neighborly HVAC franchise, so the network is relevant even though individual franchisee scale is not disclosed."},{"trades":"HVAC, plumbing, electrical","parent":"independent / Don Rackler identified as founder; no PE parent publicly confirmed in the retrieved sources","type":"large_independent","company":"Jon Wayne Service Company","note":"Company and workforce profiles describe it as San Antonio's largest residential heating, air-conditioning, plumbing and electrical contractor, with a broad local service footprint."},{"trades":"HVAC, plumbing; electrical not explicitly confirmed in the retrieved sources","parent":"independent, family-owned; led by owner Bobby Jenkins","type":"large_independent","company":"ABC Home & Commercial Services — San Antonio","note":"ABC is a long-running Texas family platform with a San Antonio branch and 24/7 heating service; the retrieved sources identify family ownership rather than a PE sponsor."}],"rollup_activity":"On July 5, 2023, P3 Services announced its acquisition of San Antonio-based Anchor Plumbing; the announcement described P3 as a Stellex Capital Management platform investment and the transaction as P3's second acquisition of 2023. Earlier, Riverside acquired Radiant in May 2021, and a later T3 description says that platform acquisition established a San Antonio presence; no primary-source 2025-26 San Antonio transaction was found in the retrieved material."},"okc":{"market_snapshot":"The Greater Oklahoma City metro is about 1.49 million people and was reported up 19% from 2010, providing a meaningful growth runway for residential service and replacement demand. The reviewed buyer set is mixed rather than fully consolidated: PE-backed platforms and franchisors are adding local capacity while long-established family-owned independents remain prominent. Hot summers and severe-weather exposure are practical demand drivers—heating/cooling degree days are energy-demand measures, and local weather sources highlight extreme heat plus damaging wind and hail—supporting HVAC load, storm repairs, and cross-trade plumbing/electrical calls.","buyers":[{"trades":"HVAC, plumbing, electrical","parent":"Apex Service Partners (Alpine Inve
